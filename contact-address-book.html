function renderSidebar(){
  const cs=Store.state.contacts;
  $('#ctAll').textContent=cs.length;
  $('#ctStar').textContent=cs.filter(c=>c.starred).length;
  $('#ctUntag').textContent=cs.filter(c=>!c.category_id&&!(c.tag_names||[]).length).length;

  const host=$('#catList');
  const cats=Store.state.categories.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.name.localeCompare(b.name,'zh'));
  /* 区块标题上的分类数量 */
  const secCnt=$('#secCatCnt');if(secCnt)secCnt.textContent=String(cats.length);
  if(!cats.length){
    host.innerHTML=`<div class="empty-hint">暂无分类${Store.admin?'，点下方「管理分类」新建':'，管理员可创建'}</div>`;
  }else{
    host.innerHTML=cats.map(cat=>{
      const subs=Store.state.subcategories.filter(s=>s.category_id===cat.id)
        .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.name.localeCompare(b.name,'zh'));
      const n=cs.filter(c=>c.category_id===cat.id).length;
      const act=View.kind==='category'&&View.categoryId===cat.id;
      /* 二级分类是否处于展开态：
         · 没有二级分类 → 恒为 0（无内容可展开，data-open 只在有内容时有意义）
         · 用户手动开/关过 → 用手动值
         · 没手动过 → 默认展开；但若二级项超过阈值则默认折叠，避免一屏塞满 */
      const key=String(cat.id);
      const manual=CatOpen[key];
      /* 正在查看的二级分类所属的一级分类，无论如何都要展开 —— 
         否则「当前项」会被折叠藏起来，用户看不到自己在哪。 */
      const holdsActive = View.kind==='subcategory' &&
        subs.some(s=>s.id===View.subcategoryId);
      const open = subs.length
        ? (holdsActive ? true : (manual===undefined ? (subs.length<=CAT_AUTO_COLLAPSE) : !!manual))
        : false;
      const subsHtml = subs.length ? `<div class="nav-sub">${subs.map(s=>{
        const sn=cs.filter(c=>c.subcategory_id===s.id).length;
        const sa=View.kind==='subcategory'&&View.subcategoryId===s.id;
        return `<button class="nav-item ${sa?'active':''}" data-nav="sub" data-id="${esc(s.id)}">
          <span class="nm">${esc(s.name)}</span><span class="ct">${sn}</span></button>`;}).join('')}</div>` : '';
      return `<div class="cat-block" data-open="${open?'1':'0'}" data-cat="${esc(cat.id)}">
        <div class="cat-row">
          ${subs.length?`<button class="cat-tgl" data-tgl="${esc(cat.id)}"
             title="${open?'折叠该分类下的二级分类':'展开该分类下的二级分类'}（共 ${subs.length} 个）"
             aria-expanded="${open?'true':'false'}"><span class="arw">▼</span></button>`
            :`<span class="cat-tgl ph"></span>`}
          <button class="nav-item ${act?'active':''}" data-nav="cat" data-id="${esc(cat.id)}">
            <span class="em">${esc(cat.icon||'📁')}</span><span class="nm">${esc(cat.name)}</span>
            ${subs.length?`<span class="sub-ct" title="二级分类数">${subs.length}</span>`:''}
            <span class="ct">${n}</span></button>
        </div>
        ${subsHtml}
      </div>`;
    }).join('');
  }
  /* 分类列表是否「还有更多可滚动」，是则加渐隐提示 */
  syncScrollHint();

  const tHost=$('#tagCloud');
  const counts={};
  cs.forEach(c=>(c.tag_names||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
  const names=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||a.localeCompare(b,'zh'));
  const tagCnt=$('#secTagCnt');if(tagCnt)tagCnt.textContent=String(names.length);
  if(!names.length){
    tHost.innerHTML=`<div class="empty-hint">暂无标签${Store.admin?'，点上方「管理」新建':'，管理员可创建'}</div>`;
  }else{
    tHost.innerHTML=names.map(nm=>{
      const col=tagColor(nm),act=View.kind==='tag'&&View.tagName===nm;
      const st=act?`background:${col};color:#fff;border-color:transparent`: `border-color:${hexToRgba(col,.42)};color:${col}`;
      return `<button class="tag-chip ${act?'active':''}" data-nav="tag" data-name="${esc(nm)}" style="${st}">
        <span class="dot" style="background:${act?'#fff':col}"></span>${esc(nm)}
        <span style="opacity:.72;font-weight:500">${counts[nm]}</span></button>`;
    }).join('');
  }
  $$('.nav-item[data-view]').forEach(b=>b.classList.toggle('active',View.kind===b.dataset.view));
}

/* ============================================================================
   侧栏折叠 / 滚动状态
   · CatOpen      每个一级分类的二级列表是否展开（用户手动值，持久化）
   · SecOpen      两个区块（分类 / 标签）是否展开
   · CAT_AUTO_COLLAPSE  二级分类多于该数量时，首次渲染默认折叠（防止一屏塞满）
   ========================================================================== */
const CAT_AUTO_COLLAPSE=8;
const CATOPEN_KEY='contacts.catopen.v1', SECOPEN_KEY='contacts.secopen.v1';
let CatOpen={}, SecOpen={categories:true,tags:true};
try{ CatOpen=JSON.parse(localStorage.getItem(CATOPEN_KEY)||'{}')||{}; }catch(e){ CatOpen={}; }
try{ const s=JSON.parse(localStorage.getItem(SECOPEN_KEY)||'null'); if(s&&typeof s==='object')SecOpen=Object.assign(SecOpen,s); }catch(e){}
function saveCatOpen(){ try{ localStorage.setItem(CATOPEN_KEY,JSON.stringify(CatOpen)); }catch(e){} }
function saveSecOpen(){ try{ localStorage.setItem(SECOPEN_KEY,JSON.stringify(SecOpen)); }catch(e){} }

/* 给「还有内容可滚」的滚动容器加 / 去底部渐隐提示。
   提示挂在 .scroll-wrap（滚动容器的父级）上，因为滚动容器自身无法固定住渐隐层。 */
function syncScrollHint(){
  $$('.scroll-box').forEach(box=>{
    try{
      const wrap=box.closest('.scroll-wrap')||box.parentElement;
      if(!wrap)return;
      const more=box.scrollHeight-box.clientHeight-box.scrollTop>6;
      wrap.classList.toggle('more',more);
    }catch(e){}
  });
}

/* 整块折叠 / 展开（分类、标签两个区块） */
function applySecOpen(){
  [['categories','#secCatTgl','#secCatBody'],['tags','#secTagTgl','#secTagBody']].forEach(([k,tglSel,bodySel])=>{
    const tgl=$(tglSel),body=$(bodySel);if(!tgl||!body)return;
    const on=SecOpen[k]!==false;
    tgl.setAttribute('aria-expanded',on?'true':'false');
    body.classList.toggle('hide',!on);
  });
  syncScrollHint();
}
function toggleSec(k){
  SecOpen[k]=!(SecOpen[k]!==false);
  saveSecOpen();applySecOpen();
}

/* 单个一级分类：折叠 / 展开它的二级列表 */
function toggleCat(id){
  const blk=$(`.cat-block[data-cat="${CSS.escape(String(id))}"]`);
  /* 优先按当前 DOM 实际状态取反（避免默认值推算与实际显示不一致） */
  const cur=blk?blk.dataset.open!=='0':(CatOpen[String(id)]!==false);
  CatOpen[String(id)]=!cur;
  saveCatOpen();
  if(blk){
    blk.dataset.open=cur?'0':'1';
    const b=blk.querySelector('.cat-tgl');
    if(b){b.setAttribute('aria-expanded',cur?'false':'true');
      b.title=(cur?'展开':'折叠')+`该分类下的二级分类`;}
  }
  syncScrollHint();
}
/* 全部展开 / 全部折叠（只影响一级分类下的二级列表） */
function toggleAllCats(open){
  Store.state.categories.forEach(c=>{ CatOpen[String(c.id)]=!!open; });
  saveCatOpen();
  $$('.cat-block').forEach(blk=>{
    blk.dataset.open=open?'1':'0';
    const b=blk.querySelector('.cat-tgl');
    if(b){b.setAttribute('aria-expanded',open?'true':'false');
      b.title=(open?'折叠':'展开')+'该分类下的二级分类';}
  });
  syncScrollHint();
}

function renderCrumbs(){
  const b=[];
  if(View.kind==='all')b.push('<b>全部联系人</b>');
  else if(View.kind==='starred')b.push('<b>⭐ 星标联系人</b>');
  else if(View.kind==='untagged')b.push('<b>🏷️ 未分类</b>');
  else if(View.kind==='tag')b.push('<span>标签</span>','<span class="sep">›</span>',`<b>${esc(View.tagName)}</b>`);
  else if(View.kind==='category'){
    const c=Store.state.categories.find(x=>x.id===View.categoryId);
    b.push('<span>分类</span>','<span class="sep">›</span>',`<b>${esc(c?(c.icon+' '+c.name):'—')}</b>`);
  }else if(View.kind==='subcategory'){
    const s=Store.state.subcategories.find(x=>x.id===View.subcategoryId);
    const c=s?Store.state.categories.find(x=>x.id===s.category_id):null;
    if(c)b.push(`<span>${esc(c.icon+' '+c.name)}</span>`,'<span class="sep">›</span>');
    b.push(`<b>${esc(s?s.name:'—')}</b>`);
  }
  if(View.q)b.push('<span class="sep">·</span>',`<span>搜索「${esc(View.q)}」</span>`);
  $('#crumbs').innerHTML=b.join(' ');
}

function renderContent(){
  const list=currentList();
  const host=$('#content');
  $('#tbCount').textContent=list.length?`${list.length} 位联系人`:'';
  $('#selBar').classList.toggle('show',View.selMode);
  document.body.classList.toggle('selmode',View.selMode);
  $('#selN').textContent=`已选 ${View.selected.size} 项`;
  ['btnSelExport','btnSelTag','btnSelCat','btnSelDel'].forEach(id=>{const b=$('#'+id);if(b)b.disabled=View.selected.size===0;});

  if(!list.length){
    const filtered=View.q||View.kind!=='all';
    host.innerHTML=`<div class="empty">
      <div class="ic">${filtered?'🔍':'📇'}</div>
      <h3>${filtered?'没有匹配的联系人':'通讯录还是空的'}</h3>
      <p>${filtered?'试试换个关键词，或点左侧「全部联系人」清除筛选。'
        :(Store.admin?'点「📥 导入」批量导入 vCard / CSV / JSON，或点「➕ 新增」手动添加。'
        :'当前是普通访问权限。请点右上角「🔒 普通访问」登录管理员后再导入或添加。')}</p>
      ${(!filtered&&Store.admin)?'<button class="btn primary" onclick="App.openForm()">➕ 新增第一位联系人</button>':''}
      ${(!filtered&&!Store.admin)?'<button class="btn primary" onclick="App.askAdmin()">🔑 管理员登录</button>':''}
    </div>`;
    return;
  }

  if(View.mode==='list'){
    host.innerHTML=`<div class="list">${list.map(rowHTML).join('')}</div>`;
  }else{
    const grouped={};
    list.forEach(c=>{const k=sortKey(c);(grouped[k]=grouped[k]||[]).push(c);});
    const keys=Object.keys(grouped);
    const alpha=keys.length>1&&!View.q&&View.kind!=='subcategory';
    if(!alpha)host.innerHTML=`<div class="grid">${list.map(cardHTML).join('')}</div>`;
    else host.innerHTML=keys.map(k=>`<div class="alpha-hd">${esc(k)}</div>
      <div class="grid">${grouped[k].map(cardHTML).join('')}</div>`).join('');
  }
  syncSelectionUI();
}

function cardHTML(c){
  const tags=(c.tag_names||[]).slice(0,3),more=(c.tag_names||[]).length-tags.length;
  const cat=catName(c.category_id),sub=subName(c.subcategory_id),ph=primaryPhone(c);
  const sel=View.selected.has(c.id);
  return `<button class="card ${sel?'selected':''}" data-act="open" data-id="${esc(c.id)}">
    <span class="check">✓</span>${avaHTML(c)}
    <div class="c-body">
      <div class="c-name"><span class="txt">${esc(displayName(c))}</span>${c.starred?'<span class="star">★</span>':''}</div>
      ${ph?`<div class="c-phone"><span class="ph-ic">📞</span><span>${esc(ph)}</span></div>`:''}
      ${(c.org||c.job_title)?`<div class="c-org">${esc([c.org,c.job_title].filter(Boolean).join(' · '))}</div>`:''}
      ${tags.length?`<div class="c-tags">${tags.map(t=>{const col=tagColor(t);
        return `<span class="mini-tag" style="background:${hexToRgba(col,.14)};color:${col}">${esc(t)}</span>`;}).join('')}
        ${more>0?`<span class="mini-tag" style="background:var(--surface-3);color:var(--text-3)">+${more}</span>`:''}</div>`:''}
      ${(cat||sub)?`<div class="c-cat">📁 ${esc([cat,sub].filter(Boolean).join(' / '))}</div>`:''}
    </div></button>`;
}
function rowHTML(c){
  const sel=View.selected.has(c.id),tags=(c.tag_names||[]).slice(0,3);
  return `<button class="row ${sel?'selected':''}" data-act="open" data-id="${esc(c.id)}">
    <span class="check">✓</span>${avaHTML(c)}
    <span class="r-name"><span class="txt">${esc(displayName(c))}</span>${c.starred?'<span style="color:#f6b93b;font-size:11px">★</span>':''}</span>
    <span class="r-phone">${esc(primaryPhone(c)||'—')}</span>
    <span class="r-org">${esc([c.org,c.job_title].filter(Boolean).join(' · ')||'—')}</span>
    <span class="r-tags">${tags.map(t=>{const col=tagColor(t);
      return `<span class="mini-tag" style="background:${hexToRgba(col,.14)};color:${col}">${esc(t)}</span>`;}).join('')}</span>
  </button>`;
}
function syncSelectionUI(){
  $$('[data-act="open"]').forEach(el=>el.classList.toggle('selected',View.selected.has(el.dataset.id)));
}

/* ------------------------------ 详情卡片 ------------------------------ */
function dItem(lb,v,kind){
  const s=String(v);
  let href='';
  if(kind==='tel')href='tel:'+phoneDigits(s);
  else if(kind==='mail')href='mailto:'+s;
  else if(kind==='url')href=s;
  const tag=href?'a':'div';
  const attr=href?`href="${esc(href)}" ${kind==='url'?'target="_blank" rel="noopener"':''}`:'';
  return `<${tag} class="d-item copyable" data-copy="${esc(s)}" ${attr}>
    <span class="di-lb">${esc(lb)}</span><span class="di-vl">${esc(s)}</span><span class="cp">📋</span></${tag}>`;
}
function openDetail(id){
  const c=Store.state.contacts.find(x=>x.id===id);
  if(!c)return;
  const cats=[catName(c.category_id),subName(c.subcategory_id)].filter(Boolean).join(' / ');
  const ph=primaryPhone(c);
  const sec=[];

  const tels=[['手机',c.phone_mobile],['工作',c.phone_work],['住宅',c.phone_home],['传真',c.phone_fax]].filter(x=>x[1]);
  if(tels.length)sec.push(`<div class="d-group"><div class="d-group-hd">电话</div>
    ${tels.map(([l,v])=>dItem(l,v,'tel')).join('')}</div>`);

  const mails=[['邮箱',c.email,'mail'],['工作邮箱',c.email_work,'mail'],['网站',c.website,'url']].filter(x=>x[1]);
  if(mails.length)sec.push(`<div class="d-group"><div class="d-group-hd">邮箱 / 网站</div>
    ${mails.map(([l,v,k])=>dItem(l,v,k)).join('')}</div>`);

  const orgs=[['公司',c.org],['部门',c.department],['职位',c.job_title]].filter(x=>x[1]);
  if(orgs.length||cats)sec.push(`<div class="d-group"><div class="d-group-hd">单位 / 组织</div>
    ${orgs.map(([l,v])=>dItem(l,v)).join('')}${cats?dItem('分类',cats):''}</div>`);

  const adr=[c.address_country,c.address_region,c.address_city,c.address_street,c.address_zip].filter(Boolean).join(' ');
  const others=[['姓名',[c.prefix,c.last_name,c.first_name,c.suffix].filter(Boolean).join(' ')],
                ['昵称',c.nickname],['生日',c.birthday],['vCard 版本',c.vcard_version||'3.0']].filter(x=>x[1]);
  if(others.length||adr)sec.push(`<div class="d-group"><div class="d-group-hd">其他信息</div>
    ${others.map(([l,v])=>dItem(l,v)).join('')}${adr?dItem('地址',adr):''}</div>`);

  if(c.note)sec.push(`<div class="d-group"><div class="d-group-hd">备注</div>
    <div class="d-note">${esc(c.note)}</div></div>`);

  $('#detail').innerHTML=`
    <div class="d-hero">
      <button class="d-close" id="dClose">✕</button>
      ${avaHTML(c,'lg')}
      <h2>${esc(displayName(c))} ${c.starred?'★':''}</h2>
      <div class="d-sub">${esc([c.job_title,c.org].filter(Boolean).join(' · ')||cats||'联系人')}</div>
      <div class="d-actions">
        ${ph?`<button data-d="call" data-v="${esc(ph)}">📞 拨号</button>`:''}
        ${ph?`<button data-d="sms" data-v="${esc(ph)}">💬 短信</button>`:''}
        ${ph?`<button data-d="copy" data-v="${esc(ph)}">📋 复制电话</button>`:''}
        ${c.email?`<button data-d="mail" data-v="${esc(c.email)}">✉️ 邮件</button>`:''}
        <button data-d="share" data-id="${esc(c.id)}">🔗 分享 vCard</button>
        ${Store.admin?`<button data-d="edit" data-id="${esc(c.id)}">✏️ 编辑</button>`:''}
        ${Store.admin?`<button data-d="del" data-id="${esc(c.id)}">🗑 删除</button>`:''}
      </div>
    </div>
    <div class="d-body">
      ${(c.tag_names||[]).length?`<div class="d-tags">${c.tag_names.map(t=>{const col=tagColor(t);
        return `<span class="mini-tag" style="background:${hexToRgba(col,.15)};color:${col};font-size:11.5px;padding:4px 10px">${esc(t)}</span>`;}).join('')}</div>`:''}
      ${sec.join('')||'<div class="empty" style="padding:26px"><p>该联系人还没有更多信息，点「编辑」补充吧。</p></div>'}
    </div>`;
  $('#dMask').classList.add('show');
  $('#dWrap').classList.add('show');
  $('#dClose').onclick=closeDetail;
}
function closeDetail(){$('#dMask').classList.remove('show');$('#dWrap').classList.remove('show');}

/* ============================================================================
   应用级渲染工具（模块作用域）
   说明：dbState / localStat / updateAb / renderVcRef / renderCredit 以及初始化调用
   必须放在 App 对象【之外】。历史上它们被误插进 App.openSettings() 内部，
   导致页面加载时根本不执行 —— 底部署名、vCard 参考都只在打开「设置」弹窗后才渲染。
   ========================================================================== */

const dbState=()=>{
  const el=$('#dbState');if(!el)return;
  if(Store.mode==='supabase'&&Store.online)
    el.className='note ok',el.innerHTML=`✅ 已连接 Supabase，数据实时同步。<br>当前：<b>${Store.state.contacts.length}</b> 位联系人 · <b>${Store.state.categories.length}</b> 个分类 · <b>${Store.state.tags.length}</b> 个标签`;
  else if(Store.configured())
    el.className='note err',el.innerHTML=`⛔ 已填写连接信息，但连接失败。<br>原因：<code>${esc(Store.err||'未知')}</code><br>请检查 URL / key 是否正确，以及数据库表是否已创建。`;
  else
    el.className='note warn',el.innerHTML=`⚠️ 未配置 Supabase，当前使用 <b>浏览器本地存储</b>（数据只在这台设备的这个浏览器里）。配置后即可云端同步。`;
};
const localStat=()=>{
  const el=$('#localStat');
  /* #localStat 只存在于「设置」弹窗里。这些函数现在也会在页面加载时执行，
     取不到节点必须直接返回，否则会抛 TypeError 中断后续初始化。 */
  if(!el)return;
  let d=null;try{d=JSON.parse(localStorage.getItem(DATA_KEY)||'null');}catch(e){}
  const n=d&&d.contacts?d.contacts.length:0;
  const bytes=(localStorage.getItem(DATA_KEY)||'').length;
  el.innerHTML=`本地缓存：<b>${n}</b> 位联系人，约 <b>${(bytes/1024).toFixed(1)} KB</b>。`;
};
const updateAb=()=>{
  const el=$('#abSize');
  if(!el)return;
  const bytes=(localStorage.getItem(DATA_KEY)||'').length;
  el.textContent=`联系人数据约 ${(bytes/1024/1024*100).toFixed(3)}% of 500MB (${(bytes/1024).toFixed(1)} KB)`;
};

  ['<b>URL 等「URI 型」取值不转义冒号</b>','这是最容易踩的坑：<code>URL</code> 和 <code>PHOTO;VALUE=uri</code> 的值是 <b>URI 类型</b>，不是文本类型，<b>不能</b>把 scheme 的冒号写成 <code>\\:</code>。<br>写成 <code>URL:https\\\\://example.com</code> 是<b>错的</b>，正确写法是 <code>URL:https://example.com</code>；<br>HTML 里的 <code>:</code>（如 <code>&amp;#58;</code>）也同理。2.1 里这些取值只需转义 <code>\\</code>、<code>\\,</code>、<code>\\;</code>。'],
  ['<b>长行折行</b>','单行超过 <b>75 字节</b> 要折行：换行后下一行<b>以 1 个空格开头</b>。注意计的是<b>字节数不是字符数</b>，一个汉字算 3 字节。'],
  ['<b>2.1 的中文编码</b>','vCard 2.1 没有规定 UTF-8。老设备要求用 <code>ENCODING=QUOTED-PRINTABLE</code> 配合 <code>CHARSET=UTF-8</code>，或直接写 UTF-8 字节。<br>本应用导出 2.1 时直接写 UTF-8，兼容性最好。'],
  ['<b>属性参数分隔符</b>','<b>2.1 用分号</b>，<b>3.0 / 4.0 用逗号</b>。<br>例：<code>TEL;TYPE=WORK,FAX:</code>（3.0）vs <code>TEL;WORK;FAX:</code>（2.1）。<br>另外 3.0/4.0 的值用<b>冒号</b>引出，2.1 也用冒号但参数写法更随意。'],
  ['<b>大小写不敏感</b>','<code>TEL</code> 与 <code>tel</code>、<code>TYPE=CELL</code> 与 <code>TYPE=cell</code> 等价。'],
  ['<b>导入容错</b>','本应用导入时会自动识别版本，能读 <code>ENCODING=BASE64</code>、<code>ENCODING=b</code>、<code>VALUE=BINARY</code> 三种头像写法，也能从被截断的文件里抢救出完整卡片。'],
];

const esc0=s=>esc(String(s));
const cellFmt=v=>v==='—'?'<span class="opt">—</span>':`<code>${esc0(v)}</code>`;

const renderVcRef=()=>{
  const host=$('#vcRef');if(!host)return;
  let h='';
  /* 版本速览 */
  h+=`<details class="acc"><summary>
    <span>📌 三种版本速览与选择建议</span><span class="badge">总览</span>
    <span class="cnt">先看这个</span></summary>
    <div class="acc-bd">
      <table class="vc-tbl"><thead><tr>
        <th style="width:72px">版本</th><th style="width:88px">年份</th><th>特点</th><th style="width:150px">适用场景</th>
      </tr></thead><tbody>
        <tr><td class="fname">vCard 2.1</td><td>1996</td>
          <td>类型参数用分号 <code>TEL;CELL:</code>；无 UTF-8 约定；<b>兼容性最广</b>但语法最松</td>
          <td>老式功能机、车载蓝牙、部分老 CRM</td></tr>
        <tr><td class="fname">vCard 3.0</td><td>2004</td>
          <td>类型参数用逗号 <code>TEL;TYPE=CELL:</code>；UTF-8 通用；<b>最推荐</b></td>
          <td>iPhone / Android / Outlook / Gmail（默认）</td></tr>
        <tr><td class="fname">vCard 4.0</td><td>2011</td>
          <td>UTF-8 原生（不需 CHARSET）；类型参数<b>语法与 3.0 相同</b>（<code>TEL;TYPE=CELL:</code>）；主要差异在头像改用 <code>PHOTO:data:image/…</code></td>
          <td>新版 Outlook、macOS 通讯录、现代 Web 应用</td></tr>
      </tbody></table>
      <div class="note" style="margin-top:12px">💡 <b>不知道选哪个就用 3.0</b>——它兼容面最广。要导进老设备选 2.1；
        要跟现代系统对接选 4.0。本应用导出时可在界面上随时切换。</div>
    </div></details>`;

  /* 字段明细 */
  VCARD_REF.forEach(g=>{
    h+=`<details class="acc"><summary>
      <span>${esc0(g.sec)}</span><span class="badge">${esc0(g.badge)}</span>
      <span class="cnt">${g.rows.length} 个字段</span></summary>
      <div class="acc-bd">
        ${g.note?`<div class="note" style="margin-bottom:10px">${g.note}</div>`:''}
        <div class="vc-wrap"><table class="vc-tbl">
          <thead><tr>
            <th style="width:118px">字段</th>
            <th style="width:150px">vCard 2.1</th>
            <th style="width:170px">vCard 3.0</th>
            <th style="width:180px">vCard 4.0</th>
            <th>格式要求</th>
          </tr></thead><tbody>
          ${g.rows.map(r=>`<tr>
            <td class="fname">${r[5]?'<span class="req">★</span> ':''}${esc0(r[0])}</td>
            <td>${cellFmt(r[1])}</td><td>${cellFmt(r[2])}</td><td>${cellFmt(r[3])}</td>
            <td>${r[4]}</td></tr>`).join('')}
          </tbody></table></div>
      </div></details>`;
  });

  /* 格式规则 */
  h+=`<details class="acc"><summary>
    <span>⚠️ 格式规则与常见坑</span><span class="badge">必读</span>
    <span class="cnt">${VCARD_RULES.length} 条</span></summary>
    <div class="acc-bd">
      <ul class="rules">${VCARD_RULES.map(r=>`<li>${r[0]}：${r[1]}</li>`).join('')}</ul>
    </div></details>`;

  /* 完整示例 */
  const sample=(ver,tel,mail,adr,photo)=>[
    'BEGIN:VCARD','VERSION:'+ver,
    'N:张;小满;;;','FN:张小满','NICKNAME:满满',
    'ORG:示例科技有限公司;市场部','TITLE:市场经理',
    tel,'EMAIL:'+(ver==='2.1'?'EMAIL;INTERNET:':(ver==='3.0'?'EMAIL;TYPE=INTERNET:':''))+mail,
    adr,'URL:https://example.com','BDAY:1990-05-20',
    'NOTE:第一行\\\\n第二行','CATEGORIES:重要,客户',photo,
    'END:VCARD'
  ].join('\n');
  h+=`<details class="acc"><summary>
    <span>📄 完整示例（可直接照抄）</span><span class="badge">示例</span>
    <span class="cnt">3 个版本</span></summary>
    <div class="acc-bd">
      <div class="rules" style="margin-bottom:8px"><b>vCard 2.1</b>：注意 TEL 与 ADR 用分号</div>
      <pre class="code">${esc0(sample('2.1','TEL;CELL:13800001234','xiaoman@example.com','ADR;HOME:;;建国路88号;北京;北京市;100022;中国','PHOTO;ENCODING=BASE64;TYPE=JPEG:（base64 数据）'))}</pre>
      <div class="rules" style="margin:14px 0 8px"><b>vCard 3.0（推荐）</b>：TYPE 用逗号</div>
      <pre class="code">${esc0(sample('3.0','TEL;TYPE=CELL:13800001234','xiaoman@example.com','ADR;TYPE=HOME:;;建国路88号;北京;北京市;100022;中国','PHOTO;ENCODING=b;TYPE=JPEG:（base64 数据）'))}</pre>
      <div class="rules" style="margin:14px 0 8px"><b>vCard 4.0</b>：类型语法同 3.0，主要差异是头像用 data: URI</div>
      <pre class="code">${esc0(sample('4.0','TEL;TYPE=CELL:13800001234','xiaoman@example.com','ADR;TYPE=HOME:;;建国路88号;北京;北京市;100022;中国','PHOTO:data:image/jpeg;base64,（base64 数据）'))}</pre>
    </div></details>`;

  host.innerHTML=h;
};

/* ---------- 页脚署名 ----------
   两处都渲染：① 弹窗「关于」页签内的 #appCredit
                ② 页面底部常驻的 #pageCredit（主区域最下方，随时可见） */
const CREDIT_NAME='公歧子', CREDIT_WX='gongqizi0';
const renderCredit=()=>{
  /* ① 关于页签 */
  const ft=$('#appCredit');
  if(ft){
    ft.innerHTML=`<div class="credit">
      <div class="ln1">通讯录 · 单文件版</div>
      <div class="ln2"><span class="brandline"><span class="dot"></span>设计：${esc(CREDIT_NAME)}
        <span class="sep">|</span>微信：<span class="wx">${esc(CREDIT_WX)}</span></span></div>
    </div>`;
  }
  /* ② 页面底部常驻 */
  const pc=$('#pageCredit');
  if(pc){
    pc.innerHTML=`<span class="pc-dot"></span>
      <span class="pc-lb">设计：</span><span class="pc-nm">${esc(CREDIT_NAME)}</span>
      <span class="pc-sep">|</span>
      <span class="pc-lb">微信：</span>
      <button class="pc-wx" id="pcWx" title="点击复制微信号 ${esc(CREDIT_WX)}"
        type="button">${esc(CREDIT_WX)}</button>`;
    const b=$('#pcWx');
    if(b)b.onclick=()=>{
      const done=()=>{
        const old=b.textContent;
        b.textContent='已复制 ✓';b.classList.add('copied');
        setTimeout(()=>{b.textContent=old||CREDIT_WX;b.classList.remove('copied');},1400);
      };
      copyText(CREDIT_WX).then(done).catch(()=>{
        /* 复制失败时退回选中文本，方便手动复制 */
        try{
          const r=document.createRange();r.selectNodeContents(b);
          const s=window.getSelection();s.removeAllRanges();s.addRange(r);
        }catch(e){}
      });
    };
  }
};


const App={
  /* ---------------- 管理员 ---------------- */
  async askAdmin(){
    if(Store.admin){
      openModal(`<div class="m-hd"><h3>🔓 管理员已登录</h3><button class="x" data-close>✕</button></div>
        <div class="m-bd"><div class="note ok">当前已获得管理员权限：可以导入 / 导出 / 新增 / 编辑 / 删除，并管理分类与标签。</div>
        <div class="note warn" style="margin-top:12px">管理员状态保存在当前标签页会话中，关闭标签页或点下方按钮即退出。</div></div>
        <div class="m-ft"><button class="btn" data-close>关闭</button>
        <button class="btn danger" id="aOut">🚪 退出管理员</button></div>`, 'narrow');
      $('#aOut').onclick=()=>App.logoutAdmin();
      return;
    }
    openModal(`<div class="m-hd"><h3>🔑 管理员登录</h3><button class="x" data-close>✕</button></div>
      <div class="m-bd">
        <div class="fld"><label>管理员密码</label>
          <input type="password" id="pwIn" placeholder="请输入管理员密码" autocomplete="current-password"></div>
        <div class="note warn" style="margin-top:14px" id="pwHint"></div>
        <div class="note" style="margin-top:10px">普通访客只能<b>查看与搜索</b>。管理员可执行导入、导出、新增、编辑、删除、批量操作与分类/标签管理。</div>
      </div>
      <div class="m-ft"><button class="btn" data-close>取消</button>
        <button class="btn primary" id="pwGo">登录</button></div>`,'narrow');

    const h=await Store.getAdminHash();
    $('#pwHint').innerHTML=h
      ? `管理员密码校验方式：<code>SHA-256</code> 哈希比对${Store.mode==='supabase'?'（存于数据库 app_settings 表）':'（存于本机浏览器）'}。`
      : `尚未设置管理员密码。首次登录请输入默认密码 <code>${esc(DEFAULT_ADMIN_PW)}</code>，登录后可在「设置」中修改。`;

    const go=async()=>{
      const v=$('#pwIn').value;
      if(!v)return toast('请输入密码','warn');
      const btn=$('#pwGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 校验中';
      const ok=await this.checkPassword(v);
      btn.disabled=false;btn.textContent='登录';
      if(ok){
        Store.admin=true;sessionStorage.setItem(SESS_KEY,'1');
        closeModal();renderAll();toast('管理员已登录，获得完整编辑权限','ok');
      }else{toast('密码错误','err');$('#pwIn').value='';$('#pwIn').focus();}
    };
    $('#pwGo').onclick=go;
    $('#pwIn').onkeydown=e=>{if(e.key==='Enter')go();};
    setTimeout(()=>{const i=$('#pwIn');if(i)i.focus();},140);
  },
  async checkPassword(pw){
    const h=await Store.getAdminHash();
    if(!h){
      if(pw===DEFAULT_ADMIN_PW){await Store.setAdminHash(await sha256hex(DEFAULT_ADMIN_PW));return true;}
      return false;
    }
    if(isHex64(h))return (await sha256hex(pw))===h;
    if(h.startsWith('plain:'))return pw===h.slice(6);
    return pw===h;
  },
  logoutAdmin(){
    Store.admin=false;sessionStorage.removeItem(SESS_KEY);
    View.selected.clear();View.selMode=false;
    closeModal();renderAll();toast('已退出管理员，切换为普通访问','info');
  },
  requireAdmin(){
    if(Store.admin)return true;
    toast('需要管理员权限，请先登录','warn');
    this.askAdmin();return false;
  },

  /* ---------------- 导航 ---------------- */
  nav(kind,o){
    o=o||{};
    View.kind=kind;View.categoryId=o.categoryId||null;View.subcategoryId=o.subcategoryId||null;View.tagName=o.tagName||null;
    View.selected.clear();
    renderAll();
    if(mq('(max-width:900px)'))toggleSide(false);
  },
  setQ(v){View.q=v;$('#searchBox').classList.toggle('has-val',!!v);renderCrumbs();renderContent();},
  setMode(m){
    View.mode=m;localStorage.setItem('contacts.viewmode',m);
    $$('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
    renderContent();
  },
  toggleSelMode(){
    View.selMode=!View.selMode;
    if(!View.selMode)View.selected.clear();
    renderContent();renderChrome();
  },
  toggleSel(id){
    if(View.selected.has(id))View.selected.delete(id);else View.selected.add(id);
    syncSelectionUI();$('#selN').textContent=`已选 ${View.selected.size} 项`;
    ['btnSelExport','btnSelTag','btnSelCat','btnSelDel'].forEach(x=>{const b=$('#'+x);if(b)b.disabled=View.selected.size===0;});
  },
  selAll(){currentList().forEach(c=>View.selected.add(c.id));renderContent();
    $('#selN').textContent=`已选 ${View.selected.size} 项`;
    ['btnSelExport','btnSelTag','btnSelCat','btnSelDel'].forEach(x=>{const b=$('#'+x);if(b)b.disabled=View.selected.size===0;});},
  selNone(){View.selected.clear();renderContent();
    ['btnSelExport','btnSelTag','btnSelCat','btnSelDel'].forEach(x=>{const b=$('#'+x);if(b)b.disabled=true;});},
  selInv(){currentList().forEach(c=>{if(View.selected.has(c.id))View.selected.delete(c.id);else View.selected.add(c.id);});
    renderContent();$('#selN').textContent=`已选 ${View.selected.size} 项`;},

  /* ---------------- 表单 ---------------- */
  openForm(id){
    if(!this.requireAdmin())return;
    const c=id?Store.state.contacts.find(x=>x.id===id):null;

      phone_mobile:'',phone_work:'',phone_home:'',phone_fax:'',email:'',email_work:'',website:'',
      org:'',department:'',job_title:'',address_street:'',address_city:'',address_region:'',address_zip:'',
      address_country:'',birthday:'',note:'',avatar_url:'',category_id:null,subcategory_id:null,

        <div class="fsec">姓名</div>
        <div class="fgrid">

            <input id="f_fn" value="${esc(d.formatted_name)}" placeholder="例如：张小满">

      $('#f_tags').innerHTML=Store.state.tags.map(t=>{
        const on=picked.has(t.name);
        const st=on?`background:${t.color};border-color:transparent;color:#fff`
                    :`border-color:${hexToRgba(t.color,.42)};color:${t.color}`;
        return `<button type="button" class="tp ${on?'on':''}" data-t="${esc(t.name)}" style="${st}">
          <span style="width:7px;height:7px;border-radius:50%;background:${on?'#fff':t.color};display:inline-block"></span>${esc(t.name)}</button>`;
      }).join('')+`<button type="button" class="add" id="tpAdd">＋ 新建标签</button>`;
      $$('#f_tags .tp').forEach(b=>b.onclick=()=>{
        const n=b.dataset.t;
        if(picked.has(n))picked.delete(n);else picked.add(n);
        renderTags();
      });
      $('#tpAdd').onclick=async()=>{
        const n=prompt('新建标签名称：');
        if(!n||!n.trim())return;
        const nm=n.trim();
        if(!Store.state.tags.some(t=>t.name===nm)){
          await Store.upsertTag({name:nm,color:AVA_COLORS[Store.state.tags.length%AVA_COLORS.length][0]});
        }
        picked.add(nm);renderTags();toast('标签已添加','ok');
      };

    renderTags();

    $('#fSave').onclick=async()=>{
      const fn=$('#f_fn').value.trim()||(($('#f_ln').value.trim()+$('#f_fnn').value.trim()).trim());
      if(!fn)return toast('请填写显示名称或姓名','warn');
      const payload={
        formatted_name:fn,last_name:$('#f_ln').value.trim(),first_name:$('#f_fnn').value.trim(),
        middle_name:$('#f_mn').value.trim(),prefix:$('#f_pf').value.trim(),suffix:$('#f_sf').value.trim(),
        nickname:$('#f_nk').value.trim(),
        phone_mobile:$('#f_pm').value.trim(),phone_work:$('#f_pw').value.trim(),
        phone_home:$('#f_ph').value.trim(),phone_fax:$('#f_pf2').value.trim(),
        email:$('#f_em').value.trim(),email_work:$('#f_emw').value.trim(),website:$('#f_ws').value.trim(),
        org:$('#f_org').value.trim(),department:$('#f_dep').value.trim(),job_title:$('#f_jt').value.trim(),
        address_street:$('#f_as').value.trim(),address_city:$('#f_ac').value.trim(),
        address_region:$('#f_ar').value.trim(),address_zip:$('#f_az').value.trim(),address_country:$('#f_an').value.trim(),
        category_id:$('#f_cat').value||null,subcategory_id:$('#f_sub').value||null,
        tag_names:Array.from(picked),birthday:$('#f_bd').value.trim(),note:$('#f_nt').value,
        avatar_url:$('#f_av').value.trim(),vcard_version:$('#f_vv').value,starred:$('#f_st').checked
      };
      const btn=$('#fSave');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 保存中…';
      try{
        if(isEdit){await Store.updateContact(id,payload);toast('已保存修改','ok');}
        else{await Store.insertContact(Object.assign({id:uid(),sort_order:0},payload));toast('联系人已创建','ok');}
        closeModal();renderAll();
      }catch(e){
        toast('保存失败：'+(e.message||e),'err',5600);
        btn.disabled=false;btn.innerHTML='💾 重试保存';
      }
    };
    if(isEdit){
      $('#fDel').onclick=async()=>{
        if(!confirm(`确定删除「${displayName(c)}」？此操作不可撤销。`))return;
        try{await Store.deleteContacts([id]);closeModal();renderAll();toast('已删除','ok');}
        catch(e){toast('删除失败：'+(e.message||e),'err',5000);}
      };
    }
  },

              placeholder="BEGIN:VCARD&#10;VERSION:3.0&#10;N:张;小满;;;&#10;FN:张小满&#10;TEL;TYPE=CELL:13800001234&#10;EMAIL:xiaoman@example.com&#10;END:VCARD&#10;&#10;—— 或者 ——&#10;姓名,手机,邮箱&#10;张小满,13800001234,xiaoman@example.com"></textarea>
          </div>
        </div>

        <div id="tab-tpl" style="display:none">
          <div class="note">先下载一份模板，照着填好再回到「📄 上传文件」导入。<b>中文表头即可</b>，列的顺序随意，
            多余的列会被忽略；标 ★ 的列建议至少填一个。</div>
          <div id="tplList" style="margin-top:12px"></div>
          <div class="fsec">CSV / TXT 可用列（中文表头）</div>
          <div class="tpl-cols" id="tplCols"></div>
          <div class="hint" style="margin-top:8px">其中「姓名」或「姓+名」至少填一个，<b>手机</b>强烈建议填（用于去重识别）。
            多个标签用逗号或分号分隔。</div>
        </div>

        <div class="fsec">导入到分类</div>
        <div class="fgrid">
          <div class="fld"><label>一级分类</label><select id="impCat"></select></div>
          <div class="fld"><label>二级分类</label><select id="impSub"></select></div>
        </div>
        <div class="hint" style="margin-top:-4px">选好分类后，本次导入的<b>所有联系人</b>都会归入该分类。
          若文件里自带分类列（category / subcategory / 分类 / 二级分类），会按文件里的值归类。</div>

        <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
          <label class="sw"><input type="checkbox" id="impCats" checked><span class="track"></span>把 CATEGORIES / 标签列转成联系人标签</label>
          <label class="sw"><input type="checkbox" id="impFileCat" checked><span class="track"></span>文件里自带分类时，优先按文件分类（否则一律用上面选定的）</label>
          <label class="sw"><input type="checkbox" id="impAutoCat" checked><span class="track"></span>文件里的分类名若不存在，自动创建</label>
          <label class="sw"><input type="checkbox" id="impDup" checked><span class="track"></span>跳过重复联系人（同姓名 + 同手机号）</label>
        </div>
        <div id="impPrev" style="margin-top:16px"></div>
      </div>
      <div class="m-ft">
        <button class="btn" data-close>取消</button>
        <button class="btn" id="impParse">👁 解析预览</button>
        <button class="btn primary" id="impGo" disabled>✅ 确认导入</button>
      </div>`,'wide');

    /* ---- 模板区渲染 ---- */
    $('#tplList').innerHTML=TEMPLATES.map((t,i)=>`
      <div class="tpl-item">
        <span class="ext">${esc(String(t.ext).toUpperCase().slice(0,5))}</span>
        <div class="meta">
          <b>${esc(t.label)}</b>
          <span>${esc(t.note)}</span>
        </div>
        <button class="btn" data-tpl="${i}">⬇ 下载</button>
      </div>`).join('');
    $$('#tplList [data-tpl]').forEach(b=>b.onclick=()=>{
      const t=TEMPLATES[+b.dataset.tpl];
      try{downloadTemplate(t);toast(`已下载「${t.label}」`,'ok');}
      catch(e){toast('下载失败：'+(e.message||e),'err');}
    });
    $('#tplCols').innerHTML=TPL_HEADERS.map((h,i)=>{
      const k=TPL_FIELD_MAP[i],f=FIELD_BY_KEY[k];
      const star=(k==='formatted_name'||k==='phone_mobile');
      return `<span class="tpl-col${star?' star':''}" title="${esc(f?f.hint||f.lb:'')}">${star?'★ ':''}${esc(h)}</span>`;
    }).join('');

    let parsed=[];
    const tabs=$$('#mBox .tabs button');
    tabs.forEach(b=>b.onclick=()=>{
      tabs.forEach(x=>x.classList.toggle('on',x===b));
      ['file','paste','tpl'].forEach(t=>{const el=$('#tab-'+t);if(el)el.style.display=(t===b.dataset.tab)?'':'none';});
    });

    /* ---- 分类下拉 ---- */
    const fillCatSel=()=>{
      const cats=Store.state.categories.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
      $('#impCat').innerHTML='<option value="">— 不指定 —</option>'+
        cats.map(c=>`<option value="${esc(c.id)}">${esc((c.icon||'📁')+' '+c.name)}</option>`).join('');
    };
    const fillImpSub=()=>{
      const cid=$('#impCat').value;
      const subs=Store.state.subcategories.filter(s=>s.category_id===cid);
      $('#impSub').innerHTML='<option value="">— 不指定 —</option>'+
        subs.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
      $('#impSub').disabled=!cid||!subs.length;
    };
    fillCatSel();fillImpSub();
    $('#impCat').onchange=fillImpSub;

    const setPreview=(cards,fmt,extra)=>{
      const host=$('#impPrev');
      if(!cards.length){host.innerHTML='';$('#impGo').disabled=true;return;}
      const vers={};
      cards.forEach(c=>{const v=c.vcard_version||'—';vers[v]=(vers[v]||0)+1;});
      const verStr=Object.keys(vers).map(v=>`v${v} × ${vers[v]}`).join(' / ');
      const fmtName={vcard:'vCard',csv:'CSV / TSV',json:'JSON',txt:'纯文本',empty:'—'}[fmt]||fmt;
      const unmapped=(extra&&extra.unmapped&&extra.unmapped.length)
        ? `<div class="hint" style="margin-top:6px">⚠️ 未识别的列（已忽略）：${extra.unmapped.map(esc).join('、')}</div>`:'';
      host.innerHTML=`<div class="note ok">识别为 <b>${esc(fmtName)}</b>，解析出 <b>${cards.length}</b> 条联系人
        <span style="color:var(--text-3);font-weight:500">（vCard 版本：${esc(verStr||'—')}）</span></div>${unmapped}
        <div class="tbl-wrap" style="margin-top:10px"><table class="tbl">
          <thead><tr><th>#</th><th>姓名</th><th>手机</th><th>邮箱</th><th>公司</th><th>标签</th></tr></thead>
          <tbody>${cards.slice(0,200).map((c,i)=>`<tr>
            <td>${i+1}</td><td>${esc(displayName(c))}</td><td>${esc(c.phone_mobile||'')}</td>
            <td>${esc(c.email||'')}</td><td>${esc(c.org||'')}</td>
            <td>${esc((c.tag_names||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>
        ${cards.length>200?`<div class="hint" style="margin-top:6px">仅预览前 200 条，实际会全部导入。</div>`:''}`;
      $('#impGo').disabled=false;
    };

    const doParse=(text,fname)=>{
      try{
        const r=parseImportText(text,fname);
        if(!r.contacts.length){
          toast('未解析到任何联系人，请检查内容格式，或先下载模板对照','warn',4600);
          parsed=[];$('#impGo').disabled=true;$('#impPrev').innerHTML='';return;
        }
        parsed=r.contacts.map(c=>normalizeCard(Object.assign({},c)));
        setPreview(parsed,r.format,r);
        toast(`识别为 ${r.format.toUpperCase()}，解析到 ${parsed.length} 条联系人`,'ok');
      }catch(e){toast('解析失败：'+(e.message||e),'err',5600);}
    };

    const drop=$('#drop');
    if(drop){
      drop.onclick=()=>$('#fileIn').click();
      drop.ondragover=e=>{e.preventDefault();drop.classList.add('over');};
      drop.ondragleave=()=>drop.classList.remove('over');
      drop.ondrop=async e=>{
        e.preventDefault();drop.classList.remove('over');
        const files=Array.from(e.dataTransfer.files||[]);
        if(files.length)await handleFiles(files);
      };
      $('#fileIn').onchange=async e=>{
        const files=Array.from(e.target.files||[]);
        if(files.length)await handleFiles(files);
      };
    }
    async function handleFiles(files){
      let all='',names=[];
      for(const f of files){
        try{all+=await f.text()+'\n';names.push(f.name);}catch(e){toast(`读取 ${f.name} 失败`,'err');}
      }
      if(!all.trim())return toast('文件内容为空','warn');
      doParse(all,names.length===1?names[0]:names.join(','));
    }

    $('#impParse').onclick=()=>{
      const t=$('#tab-paste').style.display!=='none'?$('#pasteIn').value:'';
      if(t&&t.trim())doParse(t,'paste.txt');
      else if(parsed.length)setPreview(parsed,'vcard',{});
      else toast('请先选择文件或粘贴内容','warn');
    };

    $('#impGo').onclick=async()=>{
      if(!parsed.length)return;
      const catId=$('#impCat').value||null;
      const subId=$('#impSub').value||null;
      const useCats=$('#impCats').checked;
      const useFileCat=$('#impFileCat').checked;
      const autoCat=$('#impAutoCat').checked;
      const skipDup=$('#impDup').checked;

      let list=parsed.map(c=>Object.assign({},c));

      /* ---- 文件内自带分类 → 映射为真实分类 id ---- */
      const catByName=new Map(Store.state.categories.map(c=>[String(c.name).trim(),c]));
      if(useFileCat){
        const subByName=new Map();
        const mkSub=(catId2,name)=>{
          const key=catId2+'|'+String(name).trim();
          if(subByName.has(key))return subByName.get(key);
          return Store.state.subcategories.find(s=>s.category_id===catId2&&String(s.name).trim()===String(name).trim());
        };
        for(const c of list){
          const rawCat=(c.category||[]).filter(Boolean);
          const rawSub=(c.subcategory||[]).filter(Boolean);
          if(!rawCat.length&&!rawSub.length)continue;
          /* 开关打开时「文件里的分类」优先；文件没写分类才回退到用户选定的分类 */
          let target=null;
          if(rawCat.length){
            target=catByName.get(String(rawCat[0]).trim());
            if(!target&&autoCat){
              try{
                await Store.upsertCategory({name:String(rawCat[0]).trim(),icon:'📁',
                  sort_order:Store.state.categories.length+1});
                target=Store.state.categories.find(x=>String(x.name).trim()===String(rawCat[0]).trim());
                if(target)catByName.set(String(target.name).trim(),target);
              }catch(e){}
            }
          }
          if(!target&&catId)target=Store.state.categories.find(x=>x.id===catId)||null;
          if(target){
            c.category_id=target.id;
            const sname=rawSub[0]||null;
            if(sname){
              let sub=mkSub(target.id,sname);
              if(!sub&&autoCat){
                try{
                  await Store.upsertSub({category_id:target.id,name:String(sname).trim(),
                    sort_order:Store.state.subcategories.filter(s=>s.category_id===target.id).length+1});
                  sub=Store.state.subcategories.find(s=>s.category_id===target.id&&String(s.name).trim()===String(sname).trim());
                }catch(e){}
              }
              if(sub)c.subcategory_id=sub.id;
            }else if(subId&&subId!==null&&catId&&target.id===catId){
              /* 文件没写二级分类 → 用用户选定的二级分类 */
              c.subcategory_id=subId;
            }
          }
          delete c.category;delete c.subcategory;
        }
      }else{
        list.forEach(c=>{delete c.category;delete c.subcategory;});
      }

      /* ---- 未被文件分类覆盖的，统一归入所选分类 ---- */
      list.forEach(c=>{
        if(c.category_id==null&&catId)c.category_id=catId;
        if(c.category_id==null)c.category_id=null;
        if(c.category_id===catId&&subId)c.subcategory_id=subId;
        if(c.subcategory_id===undefined||c.subcategory_id===null)c.subcategory_id=c.subcategory_id||null;
        // 若二级分类不属于该一级分类，清掉避免脏数据
        if(c.subcategory_id){
          const s=Store.state.subcategories.find(x=>x.id===c.subcategory_id);
          if(!s||s.category_id!==c.category_id)c.subcategory_id=null;
        }
      });

      /* ---- 去重 ---- */
      if(skipDup){
        const key=c=>(displayName(c).trim()+'|'+phoneDigits(c.phone_mobile)).toLowerCase();
        const exist=new Set(Store.state.contacts.map(key));
        const seen=new Set();
        const before=list.length;
        list=list.filter(c=>{const k=key(c);if(exist.has(k)||seen.has(k))return false;seen.add(k);return true;});
        if(before!==list.length)toast(`已跳过 ${before-list.length} 条重复联系人`,'info',3000);
      }
      if(!list.length){toast('没有需要导入的新联系人','info');return;}

      /* ---- CATEGORIES / 标签列 → 标签 ---- */
      if(useCats){
        const known=new Set(Store.state.tags.map(t=>t.name));
        const catNames=Store.state.categories.map(x=>x.name);
        const need=new Set();
        list.forEach(c=>{
          const kept=[];
          (c.tag_names||[]).forEach(x=>{
            const nm=String(x).trim();
            if(!nm)return;
            if(catNames.includes(nm)){ return; }           // 是分类名，不当标签
            kept.push(nm);
            if(!known.has(nm))need.add(nm);
          });
          c.tag_names=kept;
        });
        for(const nm of need){
          if(!Store.state.tags.some(t=>t.name===nm)){
            try{await Store.upsertTag({name:nm,color:AVA_COLORS[Store.state.tags.length%AVA_COLORS.length][0]});}catch(e){}
          }
        }
      }

      list.forEach(c=>{c.id=uid();if(!c.vcard_version)c.vcard_version='3.0';});

      const btn=$('#impGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 导入中…';
      try{
        await Store.insertContacts(list);
        closeModal();renderAll();
        const cat=catId?Store.state.categories.find(x=>x.id===catId):null;
        toast(`成功导入 ${list.length} 条联系人${cat?'（归入「'+cat.name+'」）':''}`,'ok',3400);
      }catch(e){
        toast('导入失败：'+(e.message||e),'err',6000);
        btn.disabled=false;btn.textContent='✅ 重试导入';
      }
    };
  },

            <b>JSON</b><span>结构化数据，便于备份与程序处理</span></button>
          <button class="fmt" data-f="xls">
            <b>Excel (xls)</b><span>表格HTML，Excel/WPS 直接打开</span></button>
        </div>

        <div class="fsec">3. 选项</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label class="sw"><input type="checkbox" id="exCatName" checked><span class="track"></span>把「分类名」写入 vCard 的 CATEGORIES</label>
          <label class="sw"><input type="checkbox" id="exPhoto" checked><span class="track"></span>导出头像（内嵌 base64，文件会变大）</label>
          <label class="sw"><input type="checkbox" id="exOneFile" checked><span class="track"></span>vCard 合并为一个文件（取消勾选则每条一个文件，打包 zip）</label>
        </div>

        <div class="note" id="exInfo" style="margin-top:16px"></div>
      </div>
      <div class="m-ft">
        <button class="btn" data-close>取消</button>
        <button class="btn" id="exPreview">👁 预览范围</button>
        <button class="btn primary" id="exGo">📤 导出并下载</button>
      </div>`,'wide');

    let fmt='vcard3', range='current';
    const rngs=$$('#exRange .rng');
    rngs.forEach(l=>{
      const inp=l.querySelector('input');
      l.onclick=e=>{
        if(inp.disabled){e.preventDefault();return;}
        inp.checked=true;range=inp.value;
        rngs.forEach(x=>x.classList.toggle('on',x===l));
        $('#exCatWrap').style.display=range==='cat'?'':'none';
        $('#exTagWrap').style.display=range==='tag'?'':'none';
        updateInfo();
      };
    });
    $$('#exFmt .fmt').forEach(b=>b.onclick=()=>{
      fmt=b.dataset.f;
      $$('#exFmt .fmt').forEach(x=>x.classList.toggle('rec',x===b));
      updateInfo();
    });

    const getList=()=>{
      if(range==='current')return currentList();
      if(range==='sel')return selectedContacts();
      if(range==='all')return Store.state.contacts.slice();
      if(range==='cat'){
        const cid=$('#exCat')?$('#exCat').value:null;
        return Store.state.contacts.filter(c=>c.category_id===cid);
      }
      if(range==='tag'){
        const tn=$('#exTag')?$('#exTag').value:null;
        return Store.state.contacts.filter(c=>(c.tag_names||[]).includes(tn));
      }
      return [];
    };
    const updateInfo=()=>{
      const n=getList().length;
      const fnMap={vcard3:'联系人.vcf',vcard4:'联系人_v4.vcf',vcard21:'联系人_v21.vcf',csv:'联系人.csv',json:'联系人.json',xls:'联系人.xls'};
      $('#exInfo').innerHTML=`将导出 <b>${n}</b> 条联系人 →
        格式 <b>${({vcard3:'vCard 3.0',vcard4:'vCard 4.0',vcard21:'vCard 2.1',csv:'CSV',json:'JSON',xls:'Excel'})[fmt]}</b>
        → 文件名 <code>${fnMap[fmt]}</code>`;
      $('#exGo').disabled=n===0;
    };
    ['#exCat','#exTag'].forEach(s=>{const el=$(s);if(el)el.onchange=updateInfo;});
    updateInfo();

    $('#exPreview').onclick=()=>{
      const l=getList();
      if(!l.length)return toast('当前范围内没有联系人','warn');
      openModal(`<div class="m-hd"><h3>👁 导出内容预览（${l.length} 条）</h3><button class="x" data-close>✕</button></div>
        <div class="m-bd"><div class="tbl-wrap" style="max-height:60vh"><table class="tbl">
          <thead><tr><th>#</th><th>姓名</th><th>手机</th><th>邮箱</th><th>公司</th><th>分类</th><th>标签</th></tr></thead>
          <tbody>${l.slice(0,300).map((c,i)=>`<tr><td>${i+1}</td><td>${esc(displayName(c))}</td>
            <td>${esc(c.phone_mobile||'')}</td><td>${esc(c.email||'')}</td><td>${esc(c.org||'')}</td>
            <td>${esc([catName(c.category_id),subName(c.subcategory_id)].filter(Boolean).join('/'))}</td>
            <td>${esc((c.tag_names||[]).join(', '))}</td></tr>`).join('')}</tbody></table></div>
          ${l.length>300?`<div class="hint" style="margin-top:8px">仅展示前 300 条。</div>`:''}</div>
        <div class="m-ft"><button class="btn primary" data-close>知道了</button></div>`,'wide');
    };

    $('#exGo').onclick=async()=>{
      let l=getList();
      if(!l.length)return toast('当前范围内没有联系人','warn');

      const useCatName=$('#exCatName').checked;
      const withPhoto=$('#exPhoto').checked;
      const oneFile=$('#exOneFile').checked;

      const work=l.map(c=>{
        const x=Object.assign({},c);
        if(!withPhoto)x.avatar_url='';
        return x;
      });
      const lookup=useCatName?((cid)=>catName(cid)):null;

      const stamp=new Date().toISOString().slice(0,10);
      try{
        if(fmt==='csv'){
          const cols=['姓名','姓','名','手机','工作电话','住宅电话','传真','邮箱','工作邮箱','网站',
            '公司','部门','职位','街道','城市','省/州','邮编','国家','生日','一级分类','二级分类','标签','备注','vCard版本'];
          const rows=work.map(c=>[displayName(c),c.last_name,c.first_name,c.phone_mobile,c.phone_work,c.phone_home,
            c.phone_fax,c.email,c.email_work,c.website,c.org,c.department,c.job_title,c.address_street,
            c.address_city,c.address_region,c.address_zip,c.address_country,c.birthday,
            catName(c.category_id),subName(c.subcategory_id),(c.tag_names||[]).join('|'),c.note,c.vcard_version||'3.0']);
          const csv='\ufeff'+[cols,...rows].map(r=>r.map(csvEscape).join(',')).join('\r\n');
          download(`联系人_${stamp}.csv`,csv,'text/csv;charset=utf-8');
          toast(`已导出 ${work.length} 条联系人（CSV）`,'ok');
        }
        else if(fmt==='json'){
          const out=work.map(c=>Object.assign({},c,{
            _category:catName(c.category_id),_subcategory:subName(c.subcategory_id)}));
          download(`联系人_${stamp}.json`,JSON.stringify({exported_at:new Date().toISOString(),count:out.length,contacts:out},null,2),'application/json');
          toast(`已导出 ${work.length} 条联系人（JSON）`,'ok');
        }
        else if(fmt==='xls'){
          const cols=['姓名','手机','工作电话','住宅电话','邮箱','公司','部门','职位','一级分类','二级分类','标签','生日','地址','备注'];
          const body=work.map(c=>`<tr>
            <td>${esc(displayName(c))}</td><td>${esc(c.phone_mobile)}</td><td>${esc(c.phone_work)}</td>
            <td>${esc(c.phone_home)}</td><td>${esc(c.email)}</td><td>${esc(c.org)}</td><td>${esc(c.department)}</td>
            <td>${esc(c.job_title)}</td><td>${esc(catName(c.category_id))}</td><td>${esc(subName(c.subcategory_id))}</td>
            <td>${esc((c.tag_names||[]).join(', '))}</td><td>${esc(c.birthday)}</td>
            <td>${esc([c.address_country,c.address_region,c.address_city,c.address_street].filter(Boolean).join(' '))}</td>
            <td>${esc(c.note)}</td></tr>`).join('');
          const html=`<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">
            </head><body><table border="1"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
            <tbody>${body}</tbody></table></body></html>`;
          download(`联系人_${stamp}.xls`,'\ufeff'+html,'application/vnd.ms-excel');
          toast(`已导出 ${work.length} 条联系人（Excel）`,'ok');
        }
        else{
          const ver=fmt==='vcard4'?'4.0':(fmt==='vcard21'?'2.1':'3.0');
          const text=toVCardMulti(work,ver,lookup);
          if(oneFile||work.length<=1){
            download(`联系人_v${ver.replace('.','')}_${stamp}.vcf`,text,'text/vcard;charset=utf-8');
            toast(`已导出 ${work.length} 条联系人（vCard ${ver}）`,'ok');
          }else{
            // 每条一个文件 → zip
            try{
              const zip=await buildZip(work.map((c,i)=>({
                name:makeFileName(c,i)+'.vcf', data:new TextEncoder().encode(toVCard(c,ver,lookup))})));
              downloadBlob(`联系人_v${ver.replace('.','')}_${stamp}.zip`,zip);
              toast(`已打包导出 ${work.length} 条联系人（vCard ${ver}，zip）`,'ok');
            }catch(e){toast('打包失败：'+(e.message||e),'err');}
          }
        }
        closeModal();
      }catch(e){toast('导出失败：'+(e.message||e),'err',5200);}
    };
  },

  /* ---------------- 批量操作 ---------------- */
  bulkTag(){
    if(!this.requireAdmin())return;
    if(!View.selected.size)return toast('请先勾选联系人','warn');
    let picked=new Set();
    openModal(`<div class="m-hd"><h3>🏷️ 批量添加标签</h3><button class="x" data-close>✕</button></div>
      <div class="m-bd">
        <div class="note">将为已勾选的 <b>${View.selected.size}</b> 位联系人添加下列标签（不会移除原有标签）。</div>
        <div class="fsec">选择标签</div>
        <div class="tagpick" id="btTags"></div>
      </div>
      <div class="m-ft"><button class="btn" data-close>取消</button>
        <button class="btn primary" id="btGo">应用</button></div>`);

    const render=()=>{
      $('#btTags').innerHTML=Store.state.tags.map(t=>{
        const on=picked.has(t.name);
        const st=on?`background:${t.color};border-color:transparent;color:#fff`
                    :`border-color:${hexToRgba(t.color,.42)};color:${t.color}`;
        return `<button type="button" class="tp ${on?'on':''}" data-t="${esc(t.name)}" style="${st}">
          <span style="width:7px;height:7px;border-radius:50%;background:${on?'#fff':t.color};display:inline-block"></span>${esc(t.name)}</button>`;
      }).join('')+`<button type="button" class="add" id="btAdd">＋ 新建标签</button>`;
      $$('#btTags .tp').forEach(b=>b.onclick=()=>{
        const n=b.dataset.t;if(picked.has(n))picked.delete(n);else picked.add(n);render();});
      $('#btAdd').onclick=async()=>{
        const n=prompt('新建标签名称：');if(!n||!n.trim())return;
        const nm=n.trim();
        if(!Store.state.tags.some(t=>t.name===nm))
          await Store.upsertTag({name:nm,color:AVA_COLORS[Store.state.tags.length%AVA_COLORS.length][0]});
        picked.add(nm);render();
      };
    };
    render();
    $('#btGo').onclick=async()=>{
      if(!picked.size)return toast('请至少选择一个标签','warn');
      const btn=$('#btGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 应用中…';
      const list=selectedContacts();
      try{
        for(const c of list){
          const set=new Set([...(c.tag_names||[]),...picked]);
          await Store.updateContact(c.id,{tag_names:Array.from(set)});
        }
        closeModal();renderAll();toast(`已为 ${list.length} 位联系人添加标签`,'ok');
      }catch(e){toast('操作失败：'+(e.message||e),'err',5200);btn.disabled=false;btn.textContent='重试';}
    };
  },

  bulkCat(){
    if(!this.requireAdmin())return;
    if(!View.selected.size)return toast('请先勾选联系人','warn');
    openModal(`<div class="m-hd"><h3>📁 批量设置分类</h3><button class="x" data-close>✕</button></div>
      <div class="m-bd">
        <div class="note">将把已勾选的 <b>${View.selected.size}</b> 位联系人移动到指定分类。</div>
        <div class="fsec">目标分类</div>
        <div class="fgrid">
          <div class="fld"><label>一级分类</label><select id="bcCat">
            <option value="">— 清空分类 —</option>
            ${Store.state.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.icon+' '+c.name)}</option>`).join('')}
          </select></div>
          <div class="fld"><label>二级分类</label><select id="bcSub"><option value="">— 无 —</option></select></div>
        </div>
        <div style="margin-top:12px"><label class="sw"><input type="checkbox" id="bcTags" checked>
          <span class="track"></span>同时把「分类名」加入标签</label></div>
      </div>
      <div class="m-ft"><button class="btn" data-close>取消</button>
        <button class="btn primary" id="bcGo">应用</button></div>`);

    const fill=()=>{
      const cid=$('#bcCat').value;
      $('#bcSub').innerHTML='<option value="">— 无 —</option>'+Store.state.subcategories.filter(s=>s.category_id===cid)
        .map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
      $('#bcSub').disabled=!cid;
    };
    $('#bcCat').onchange=fill;fill();

    $('#bcGo').onclick=async()=>{
      const cid=$('#bcCat').value||null, sid=$('#bcSub').value||null;
      const withTag=$('#bcTags').checked;
      const cname=cid?catName(cid):'';
      const btn=$('#bcGo');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 应用中…';
      const list=selectedContacts();
      try{
        for(const c of list){
          const patch={category_id:cid,subcategory_id:sid};
          if(withTag&&cname&&!(c.tag_names||[]).includes(cname)){
            patch.tag_names=[...(c.tag_names||[]),cname];
          }
          await Store.updateContact(c.id,patch);
        }
        closeModal();renderAll();toast(`已更新 ${list.length} 位联系人的分类`,'ok');
      }catch(e){toast('操作失败：'+(e.message||e),'err',5200);btn.disabled=false;btn.textContent='重试';}
    };
  },

  async bulkDelete(){
    if(!this.requireAdmin())return;
    const n=View.selected.size;
    if(!n)return toast('请先勾选联系人','warn');
    if(!confirm(`确定要删除已勾选的 ${n} 位联系人吗？\n\n此操作不可撤销（建议先导出备份）。`))return;
    try{
      await Store.deleteContacts(Array.from(View.selected));
      View.selected.clear();renderAll();toast(`已删除 ${n} 位联系人`,'ok');
    }catch(e){toast('删除失败：'+(e.message||e),'err',5200);}
  },

  /* ---------------- 分类 / 标签管理 ---------------- */
  /* 分类管理：一级 / 二级分类均可 新增 / 编辑 / 删除。
     编辑走内嵌表单（不再用 prompt），二级分类不再依赖“所属一级分类”下拉，全部平铺展示。 */
  mgrCategory(){
    if(!this.requireAdmin())return;
    openModal(`<div class="m-hd"><h3>📁 分类管理</h3><button class="x" data-close>✕</button></div>
      <div class="m-bd">
        <div class="note">支持一级 / 二级分类，两者都可以独立<b>新增、编辑、删除</b>。联系人可挂在一级或二级分类下；删除分类不会删除联系人。</div>

        <div class="fsec">一级分类</div>
        <div id="mcList"></div>
        <div id="mcForm" class="cat-form" hidden>
          <div class="fld"><label>分类名称 <span style="color:var(--danger)">*</span></label>
            <input id="mcName" maxlength="20" placeholder="例如：家人 / 客户 / 供应商"><div class="hint">必填，建议 2–8 个字</div></div>
          <div class="fld"><label>图标</label>
            <input id="mcIcon" maxlength="4" placeholder="📁"><div class="hint">直接粘贴一个 emoji，或点击下方常用图标</div>
            <div class="icpick" id="mcIcons"></div></div>
          <div class="fld"><label>排序值</label>
            <input id="mcSort" type="number" min="0" step="1" placeholder="0"><div class="hint">数字越小越靠前</div></div>
          <div class="row-btns">
            <button class="btn primary sm" id="mcSave">保存</button>
            <button class="btn sm" id="mcCancel">取消</button>
          </div>
        </div>
        <button class="btn primary sm" id="mcAdd" style="margin-top:10px">➕ 新建一级分类</button>

        <div class="fsec">二级分类</div>
        <div class="fld"><label>筛选（可选）</label>
          <select id="mcParent"><option value="">全部一级分类</option></select>
          <div class="hint">仅用于查看过滤，不影响新增与编辑</div></div>
        <div id="msList" style="margin-top:12px"></div>
        <div id="msForm" class="cat-form" hidden>
          <div class="fld"><label>所属一级分类 <span style="color:var(--danger)">*</span></label>
            <select id="msParent"></select></div>
          <div class="fld"><label>二级分类名称 <span style="color:var(--danger)">*</span></label>
            <input id="msName" maxlength="20" placeholder="例如：高中同学 / 重点客户"></div>
          <div class="fld"><label>排序值</label>
            <input id="msSort" type="number" min="0" step="1" placeholder="0"></div>
          <div class="row-btns">
            <button class="btn primary sm" id="msSave">保存</button>
            <button class="btn sm" id="msCancel">取消</button>
          </div>
        </div>
        <button class="btn primary sm" id="msAdd" style="margin-top:10px">➕ 新建二级分类</button>
      </div>
      <div class="m-ft"><button class="btn primary" data-close>完成</button></div>`);

    const ICONS=['📁','👨‍👩‍👧','👥','💼','🤝','⭐','🏢','🎓','🏠','📞','❤️','🔖'];
    $('#mcIcons').innerHTML=ICONS.map(i=>`<button type="button" class="icb" data-ic="${esc(i)}">${i}</button>`).join('');
    $$('#mcIcons .icb').forEach(b=>b.onclick=()=>{$('#mcIcon').value=b.dataset.ic;});

    const cntInCat = id => Store.state.contacts.filter(c=>c.category_id===id).length;
    const cntInSub = id => Store.state.contacts.filter(c=>c.subcategory_id===id).length;

    /* 一级分类列表 */
    const drawCats=()=>{
      const cats=Store.state.categories.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.name.localeCompare(b.name,'zh'));
      $('#mcList').innerHTML=cats.length?cats.map((c,idx)=>{
        const subs=Store.state.subcategories.filter(s=>s.category_id===c.id);
        return `<div class="cat-row">
          <span class="ico">${esc(c.icon||'📁')}</span>
          <div class="cmeta">
            <b>${esc(c.name)}</b>
            <span>${cntInCat(c.id)} 位联系人 · ${subs.length} 个二级分类 · 排序 ${c.sort_order||0}</span>
          </div>
          <div class="cbtns">
            <button class="iconbtn" title="上移" data-up="${esc(c.id)}" ${idx===0?'disabled':''}>↑</button>
            <button class="iconbtn" title="下移" data-down="${esc(c.id)}" ${idx===cats.length-1?'disabled':''}>↓</button>
            <button class="iconbtn" title="编辑" data-ec="${esc(c.id)}">✏️</button>
            <button class="iconbtn danger" title="删除" data-dc="${esc(c.id)}">🗑</button>
          </div></div>`;}).join(''):'<div class="empty-hint">暂无一级分类，点下方按钮创建</div>';

      $$('#mcList [data-ec]').forEach(b=>b.onclick=()=>{
        const c=Store.state.categories.find(x=>x.id===b.dataset.ec);if(!c)return;
        catEditId=c.id;
        $('#mcForm').hidden=false;$('#mcName').value=c.name;$('#mcIcon').value=c.icon||'📁';$('#mcSort').value=c.sort_order||0;
        $('#mcName').focus();$('#mcName').select();
        safeScroll($('#mcForm'));
      });
      $$('#mcList [data-dc]').forEach(b=>b.onclick=async()=>{
        const c=Store.state.categories.find(x=>x.id===b.dataset.dc);if(!c)return;
        const subN=Store.state.subcategories.filter(s=>s.category_id===c.id).length;
        const ctN=cntInCat(c.id);
        if(!confirm(`删除一级分类「${c.name}」？\n\n· 其下 ${subN} 个二级分类会一并删除\n· ${ctN} 位联系人的分类会被清空（联系人本身不会被删除）\n\n此操作不可撤销。`))return;
        try{await Store.deleteCategory(c.id);drawAll();renderAll();toast('已删除一级分类','ok');}
        catch(e){toast('删除失败：'+(e.message||e),'err',5200);}
      });
      $$('#mcList [data-up]').forEach(b=>b.onclick=()=>moveCat(b.dataset.up,-1));
      $$('#mcList [data-down]').forEach(b=>b.onclick=()=>moveCat(b.dataset.down,1));
    };

    const moveCat=async(id,dir)=>{
      const cats=Store.state.categories.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
      const i=cats.findIndex(c=>c.id===id);const j=i+dir;
      if(i<0||j<0||j>=cats.length)return;
      const a=cats[i],b=cats[j];
      try{
        await Store.upsertCategory({id:a.id,name:a.name,icon:a.icon,sort_order:j+1});
        await Store.upsertCategory({id:b.id,name:b.name,icon:b.icon,sort_order:i+1});
        drawAll();renderAll();toast('顺序已调整','ok');
      }catch(e){toast('调整失败：'+(e.message||e),'err');}
    };

    /* 二级分类列表：不依赖筛选下拉，全部平铺；筛选只做过滤 */
    const drawSubs=()=>{
      const f=$('#mcParent').value;
      const cats=Store.state.categories.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0)||a.name.localeCompare(b.name,'zh'));
      let subs=Store.state.subcategories.slice();
      if(f)subs=subs.filter(s=>s.category_id===f);
      subs.sort((a,b)=>{
        const ca=cats.findIndex(c=>c.id===a.category_id), cb=cats.findIndex(c=>c.id===b.category_id);
        return ca-cb || (a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name,'zh');
      });
      $('#msList').innerHTML=subs.length?subs.map(s=>{
        const p=Store.state.categories.find(c=>c.id===s.category_id);
        return `<div class="cat-row sm">
          <span class="ico">${esc(p&&p.icon||'📂')}</span>
          <div class="cmeta">
            <b>${esc(s.name)}</b>
            <span>${esc(p?p.name:'（一级分类已删除）')} · ${cntInSub(s.id)} 位联系人 · 排序 ${s.sort_order||0}</span>
          </div>
          <div class="cbtns">
            <button class="iconbtn" title="编辑" data-es="${esc(s.id)}">✏️</button>
            <button class="iconbtn danger" title="删除" data-ds="${esc(s.id)}">🗑</button>
          </div></div>`;}).join(''):(f?'<div class="empty-hint">该一级分类下暂无二级分类</div>':'<div class="empty-hint">暂无二级分类，点下方按钮创建</div>');

      $$('#msList [data-es]').forEach(b=>b.onclick=()=>{
        const s=Store.state.subcategories.find(x=>x.id===b.dataset.es);if(!s)return;
        subEditId=s.id;
        fillParentSelect($('#msParent'),s.category_id);
        $('#msForm').hidden=false;$('#msName').value=s.name;$('#msSort').value=s.sort_order||0;
        $('#msName').focus();$('#msName').select();
        safeScroll($('#msForm'));
      });
      $$('#msList [data-ds]').forEach(b=>b.onclick=async()=>{
        const s=Store.state.subcategories.find(x=>x.id===b.dataset.ds);if(!s)return;
        const n=cntInSub(s.id);
        if(!confirm(`删除二级分类「${s.name}」？\n\n${n} 位联系人会从该二级分类移出（联系人本身不会被删除）。\n\n此操作不可撤销。`))return;
        try{await Store.deleteSub(s.id);drawAll();renderAll();toast('已删除二级分类','ok');}
        catch(e){toast('删除失败：'+(e.message||e),'err',5200);}
      });
    };

    const fillParentSelect=(sel,keep)=>{
      const cats=Store.state.categories.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
      const cur=keep||sel.value||(cats[0]&&cats[0].id)||'';
      sel.innerHTML=cats.length?cats.map(c=>`<option value="${esc(c.id)}">${esc((c.icon||'📁')+' '+c.name)}</option>`).join('')
        :'<option value="">（请先创建一级分类）</option>';
      if(cur&&cats.some(c=>c.id===cur))sel.value=cur;
    };

    let catEditId=null, subEditId=null;

    const drawAll=()=>{
      drawCats();
      const fSel=$('#mcParent'), keep=fSel.value;
      fSel.innerHTML='<option value="">全部一级分类</option>'+
        Store.state.categories.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
          .map(c=>`<option value="${esc(c.id)}">${esc((c.icon||'📁')+' '+c.name)}</option>`).join('');
      if(keep&&Store.state.categories.some(c=>c.id===keep))fSel.value=keep;
      fillParentSelect($('#msParent'));
      drawSubs();
    };

    const hideForms=()=>{catEditId=null;subEditId=null;$('#mcForm').hidden=true;$('#msForm').hidden=true;};

    /* 新建 / 保存 一级分类 */
    $('#mcAdd').onclick=()=>{
      catEditId=null;
      $('#mcForm').hidden=false;$('#mcName').value='';$('#mcIcon').value='📁';
      $('#mcSort').value=Store.state.categories.length;
      $('#msForm').hidden=true;
      $('#mcName').focus();
      safeScroll($('#mcForm'));
    };
    $('#mcCancel').onclick=()=>{$('#mcForm').hidden=true;catEditId=null;};
    $('#mcSave').onclick=async()=>{
      const name=$('#mcName').value.trim();
      if(!name)return toast('请填写分类名称','warn');
      const dup=Store.state.categories.find(c=>c.name===name&&c.id!==catEditId);
      if(dup)return toast('已存在同名一级分类','warn');
      const icon=$('#mcIcon').value.trim()||'📁';
      const sort=Number($('#mcSort').value)||0;
      const btn=$('#mcSave');btn.disabled=true;
      try{
        if(catEditId){
          const c=Store.state.categories.find(x=>x.id===catEditId);
          await Store.upsertCategory({id:catEditId,name,icon,sort_order:sort});
          /* 级联更新内存中挂在旧名下的联系人（在线模式由数据库外键保证，这里同步本地副本） */
          void c;
          toast('一级分类已更新','ok');
        }else{
          await Store.upsertCategory({name,icon,sort_order:sort});
          toast('一级分类已创建','ok');
        }
        hideForms();drawAll();renderAll();
      }catch(e){toast('保存失败：'+(e.message||e),'err',5200);}
      finally{btn.disabled=false;}
    };

    /* 新建 / 保存 二级分类 */
    $('#msAdd').onclick=()=>{
      if(!Store.state.categories.length)return toast('请先创建一级分类','warn');
      subEditId=null;
      fillParentSelect($('#msParent'),$('#mcParent').value||undefined);
      $('#msForm').hidden=false;$('#msName').value='';
      $('#msSort').value=Store.state.subcategories.length;
      $('#mcForm').hidden=true;
      $('#msName').focus();
      safeScroll($('#msForm'));
    };
    $('#msCancel').onclick=()=>{$('#msForm').hidden=true;subEditId=null;};
    $('#msSave').onclick=async()=>{
      const name=$('#msName').value.trim();
      const pid=$('#msParent').value;
      if(!pid)return toast('请先创建一级分类','warn');
      if(!name)return toast('请填写二级分类名称','warn');
      if(Store.state.subcategories.some(s=>s.category_id===pid&&s.name===name&&s.id!==subEditId))
        return toast('该一级分类下已存在同名二级分类','warn');
      const sort=Number($('#msSort').value)||0;
      const btn=$('#msSave');btn.disabled=true;
      try{
        if(subEditId)await Store.upsertSub({id:subEditId,category_id:pid,name,sort_order:sort});
        else await Store.upsertSub({category_id:pid,name,sort_order:sort});
        hideForms();drawAll();renderAll();
        toast(subEditId?'二级分类已更新':'二级分类已创建','ok');
      }catch(e){toast('保存失败：'+(e.message||e),'err',5200);}
      finally{btn.disabled=false;}
    };

    $('#mcParent').onchange=drawSubs;
    drawAll();
  },

  mgrTag(){
    if(!this.requireAdmin())return;
    openModal(`<div class="m-hd"><h3>🏷️ 标签管理</h3><button class="x" data-close>✕</button></div>
      <div class="m-bd">
        <div class="note">标签可给任意联系人叠加，用于跨分类的灵活归类（例如「重要」「待跟进」）。</div>
        <div id="mtList" style="margin-top:14px"></div>
        <button class="btn primary sm" id="mtAdd" style="margin-top:10px">➕ 新建标签</button>
      </div>
      <div class="m-ft"><button class="btn primary" data-close>完成</button></div>`);

    const draw=()=>{
      const list=Store.state.tags.slice().sort((a,b)=>a.name.localeCompare(b.name,'zh'));
      $('#mtList').innerHTML=list.length?list.map(t=>{
        const n=Store.state.contacts.filter(c=>(c.tag_names||[]).includes(t.name)).length;
        return `<div style="display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);
          border-radius:11px;margin-bottom:6px;background:var(--surface-2)">
          <span style="width:12px;height:12px;border-radius:50%;background:${esc(t.color)};flex:0 0 auto"></span>
          <b style="flex:1;font-size:13.5px">${esc(t.name)}</b>
          <span style="font-size:11px;color:var(--text-3);background:var(--surface-3);padding:1px 7px;border-radius:20px">${n} 人</span>
          <input type="color" value="${esc(t.color)}" data-ct="${esc(t.id)}" style="width:30px;height:28px;border:1px solid var(--border);border-radius:8px;padding:1px;background:var(--surface);cursor:pointer">
          <button class="iconbtn" style="width:30px;height:30px;font-size:13px" data-et="${esc(t.id)}">✏️</button>
          <button class="iconbtn" style="width:30px;height:30px;font-size:13px;color:var(--danger)" data-dt="${esc(t.id)}">🗑</button>
        </div>`;}).join(''):'<div class="empty-hint">暂无标签</div>';

      $$('#mtList [data-ct]').forEach(inp=>inp.onchange=async()=>{
        const t=Store.state.tags.find(x=>x.id===inp.dataset.ct);
        try{await Store.upsertTag({id:t.id,name:t.name,color:inp.value});draw();renderAll();toast('颜色已更新','ok');}
        catch(e){toast('失败：'+(e.message||e),'err');}
      });
      $$('#mtList [data-et]').forEach(b=>b.onclick=async()=>{
        const t=Store.state.tags.find(x=>x.id===b.dataset.et);
        const nm=prompt('修改标签名称：',t.name);if(nm===null||!nm.trim())return;
        const oldName=t.name;
        try{
          await Store.upsertTag({id:t.id,name:nm.trim(),color:t.color});
          Store.state.contacts.forEach(c=>{
            const i=(c.tag_names||[]).indexOf(oldName);
            if(i>=0)c.tag_names[i]=nm.trim();
          });
          if(Store.mode!=='supabase')await Store.saveLocal();
          draw();renderAll();toast('已更新','ok');
        }catch(e){toast('失败：'+(e.message||e),'err');}
      });
      $$('#mtList [data-dt]').forEach(b=>b.onclick=async()=>{
        const t=Store.state.tags.find(x=>x.id===b.dataset.dt);
        if(!confirm(`删除标签「${t.name}」？\n该标签会从所有联系人身上移除（不会删除联系人）。`))return;
        try{await Store.deleteTag(t.id);draw();renderAll();toast('已删除','ok');}catch(e){toast('失败：'+(e.message||e),'err');}
      });
    };
    $('#mtAdd').onclick=async()=>{
      const nm=prompt('新建标签名称：');if(!nm||!nm.trim())return;
      try{await Store.upsertTag({name:nm.trim(),
        color:AVA_COLORS[Store.state.tags.length%AVA_COLORS.length][0]});draw();renderAll();toast('标签已创建','ok');}
      catch(e){toast('创建失败：'+(e.message||e),'err',5000);}
    };
    draw();
  },

        for(const c of (d.categories||[])){
          if(!Store.state.categories.some(x=>x.name===c.name))
            await Store.upsertCategory({name:c.name,icon:c.icon,sort_order:c.sort_order});

        for(const s of (d.subcategories||[])){
          const cat=Store.state.categories.find(x=>x.name===(d.categories.find(y=>y.id===s.category_id)||{}).name);

            await Store.upsertSub({category_id:cat.id,name:s.name,sort_order:s.sort_order});

        const mapped=(d.contacts||[]).map(c=>{
          const x=Object.assign({},c);
          const oldCat=(d.categories||[]).find(y=>y.id===c.category_id);
          const newCat=oldCat?Store.state.categories.find(y=>y.name===oldCat.name):null;
          x.category_id=newCat?newCat.id:null;
          const oldSub=(d.subcategories||[]).find(y=>y.id===c.subcategory_id);
          const newSub=oldSub?Store.state.subcategories.find(y=>y.name===oldSub.name&&y.category_id===(newCat?newCat.id:null)):null;
          x.subcategory_id=newSub?newSub.id:null;
          delete x.id;
          return x;

        await Store.insertContacts(mapped);
        await Store.loadAll();closeModal();renderAll();
        toast(`已上传 ${mapped.length} 位联系人到 Supabase`,'ok',3600);
      }catch(e){toast('上传失败：'+(e.message||e),'err',6000);btn.disabled=false;btn.textContent='⬆️ 把本地数据上传到 Supabase';}
    };
    $('#locClear').onclick=()=>{
      if(!confirm('清空本地浏览器缓存的所有联系人数据？\n\n⚠️ 此操作不可撤销。若数据还没同步到 Supabase，将会永久丢失。\n建议先导出备份。'))return;
      localStorage.removeItem(DATA_KEY);localStorage.removeItem(DATA_KEY+'.seeded');
      Store.state={categories:[],subcategories:[],tags:[],contacts:[]};
      closeModal();renderAll();toast('本地数据已清空','info');

    $('#pwChg').onclick=async()=>{
      const o=$('#pwOld').value,n1=$('#pwNew').value,n2=$('#pwNew2').value;
      if(!await App.checkPassword(o))return toast('当前密码不正确','err');
      if(!n1||n1.length<6)return toast('新密码至少 6 位','warn');

      const btn=$('#pwChg');btn.disabled=true;btn.innerHTML='<span class="spin"></span> 保存中…';
      try{

        btn.disabled=false;btn.textContent='🔐 修改密码';
        $('#pwOld').value=$('#pwNew').value=$('#pwNew2').value='';
        toast('管理员密码已更新','ok');
      }catch(e){toast('保存失败：'+(e.message||e),'err',5200);btn.disabled=false;btn.textContent='🔐 修改密码';}
    };
  }
};

/* ============================================================================
   zip（无依赖，store 模式 + CRC32）
   ========================================================================== */
const CRC_TABLE=(()=>{const t=new Uint32Array(256);
  for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(buf){let c=0xFFFFFFFF;for(let i=0;i<buf.length;i++)c=CRC_TABLE[(c^buf[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeFileName(c,i){
  const nm=displayName(c).replace(/[\\/:*?"<>|\r\n\t]/g,'_').slice(0,40)||('contact'+i);
  return String(i+1).padStart(3,'0')+'_'+nm;
}
async function buildZip(entries){
  const enc=new TextEncoder();
  const parts=[],central=[];
  let offset=0;
  const dosTime=(()=>{const d=new Date();return ((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()/2))>>>0;})();
  const dosDate=(()=>{const d=new Date();return (((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())>>>0;})();

  for(const e of entries){
    const nameBuf=enc.encode(e.name);
    const data=e.data instanceof Uint8Array?e.data:enc.encode(String(e.data));
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);
    lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,dosTime,true);lh.setUint16(12,dosDate,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,nameBuf.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nameBuf,data);

    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);
    ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);
    ch.setUint16(12,dosTime,true);ch.setUint16(14,dosDate,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nameBuf.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);
    ch.setUint16(34,0,true);ch.setUint16(36,0,true);ch.setUint32(38,0,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameBuf);
    offset+=30+nameBuf.length+data.length;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0);
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true);
  eocd.setUint16(8,entries.length,true);eocd.setUint16(10,entries.length,true);
  eocd.setUint32(12,cdSize,true);eocd.setUint32(16,offset,true);
  const all=[...parts,...central,new Uint8Array(eocd.buffer)];
  const total=all.reduce((a,b)=>a+b.length,0);
  const out=new Uint8Array(total);let p=0;
  for(const a of all){out.set(a,p);p+=a.length;}
  return new Blob([out],{type:'application/zip'});
}

/* 分享单条 vCard */
async function shareContact(c){
  const ver=c.vcard_version||'3.0';
  const text=toVCard(c,ver,id=>catName(id));
  const file=new File([text],makeFileName(c,0)+'.vcf',{type:'text/vcard'});
  const nav=navigator;
  if(nav.canShare&&nav.canShare({files:[file]})){
    try{await nav.share({files:[file],title:displayName(c),text:'联系人：'+displayName(c)});return;}catch(e){if(e.name==='AbortError')return;}
  }
  // 降级：复制文本 / 下载
  openModal(`<div class="m-hd"><h3>🔗 分享「${esc(displayName(c))}」</h3><button class="x" data-close>✕</button></div>
    <div class="m-bd">
      <div class="note">vCard ${esc(ver)} 文本（可直接粘贴给微信 / 邮件 / 通讯录 App）：</div>
      <textarea id="shTxt" style="width:100%;min-height:220px;margin-top:10px;padding:10px;border:1px solid var(--border);
        border-radius:10px;background:var(--surface-2);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
        line-height:1.6;resize:vertical">${esc(text)}</textarea>
    </div>
    <div class="m-ft">
      <button class="btn" id="shCopy">📋 复制文本</button>
      <button class="btn primary" id="shDl">⬇️ 下载 .vcf</button>
    </div>`);
  $('#shCopy').onclick=async()=>{try{await navigator.clipboard.writeText(text);toast('vCard 文本已复制','ok');}
    catch(e){$('#shTxt').select();toast('请按 Ctrl+C 复制','info');}};
  $('#shDl').onclick=()=>{download(`${makeFileName(c,0)}.vcf`,text,'text/vcard;charset=utf-8');toast('已下载','ok');};
}

document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select';
  if(e.key==='Escape'){
    if($('#dWrap').classList.contains('show'))closeDetail();
    else if($('#mWrap').classList.contains('show'))closeModal();
    else if(View.selMode)App.toggleSelMode();

  }
  if(typing)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();$('#q').select();return;}
  if(e.key==='/'){e.preventDefault();$('#q').focus();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='i'&&Store.admin){e.preventDefault();App.openImport();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'&&Store.admin){e.preventDefault();App.openExport();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&Store.admin){e.preventDefault();App.openForm();return;}
});

/* ============================================================================
   首次渲染
   必须在【DOM 解析完成之后】执行：本 <script> 位于 <body> 末尾，
   且 #pageCredit / #vcRef / #sideScroll 等节点都在它之前，所以可以直接调用。

   每一步都单独 try/catch：这些函数职责互不相关，
   其中任何一个出错都不应该拖垮其它渲染（曾经因为 localStat 空指针，
   导致底部署名与 vCard 参考一起静默失效）。
   ========================================================================== */
function bootFirstPaint(){
  [['dbState',dbState],['localStat',localStat],['updateAb',updateAb],
   ['renderVcRef',renderVcRef],['renderCredit',renderCredit],['applySecOpen',applySecOpen]
  ].forEach(([name,fn])=>{
    try{ fn(); }catch(e){ console.error('[boot] '+name+' 失败：',e&&e.message||e); }
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootFirstPaint);
else bootFirstPaint();
