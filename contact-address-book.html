<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>通讯录 · Contacts Manager</title>
<style>
:root{
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8f9fd; --surface-3:#eef1f9;
  --border:#e3e8f4; --border-strong:#d2d9ec;
  --text:#1b2136; --text-2:#5b6480; --text-3:#8d96ad;
  --brand:#5b6cff; --brand-2:#8b5cf6; --brand-soft:#eef0ff;
  --ok:#10b981; --warn:#f5a623; --danger:#ef4d5a; --info:#3b9dff;
  --shadow-sm:0 1px 2px rgba(23,32,63,.05),0 1px 3px rgba(23,32,63,.05);
  --shadow-md:0 4px 12px rgba(23,32,63,.07),0 2px 4px rgba(23,32,63,.04);
  --shadow-lg:0 16px 40px rgba(23,32,63,.14),0 4px 12px rgba(23,32,63,.06);
  --shadow-xl:0 28px 70px rgba(23,32,63,.22);
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:26px; --header-h:62px;
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1119; --surface:#171d2c; --surface-2:#1d2436; --surface-3:#242c42;
  --border:#2a3348; --border-strong:#3a4560;
  --text:#eaeefb; --text-2:#a4aec8; --text-3:#76809b;
  --brand:#7c8bff; --brand-2:#a78bfa; --brand-soft:#232a4d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 4px 14px rgba(0,0,0,.42);
  --shadow-lg:0 18px 44px rgba(0,0,0,.55); --shadow-xl:0 30px 76px rgba(0,0,0,.65);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
#app{display:flex;flex-direction:column;height:100dvh}

/* ---------- header ---------- */
.hdr{height:var(--header-h);flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:60}
.hdr-logo{width:34px;height:34px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;font-size:17px;font-weight:700;
  box-shadow:0 3px 10px rgba(91,108,255,.34)}
.hdr-brand{font-weight:700;font-size:15.5px;letter-spacing:.2px;white-space:nowrap}
.hdr-brand small{display:block;font-weight:500;font-size:10.5px;color:var(--text-3);letter-spacing:.6px;margin-top:-1px}
.hdr-spacer{flex:1}
.hdr-search{flex:1 1 380px;max-width:430px;position:relative;display:flex;align-items:center}
.hdr-search .ic{position:absolute;left:12px;font-size:14px;color:var(--text-3);pointer-events:none}
.hdr-search input{width:100%;height:38px;padding:0 34px;border-radius:11px;border:1px solid var(--border);
  background:var(--surface-2);outline:none;transition:border-color .16s,box-shadow .16s,background .16s}
.hdr-search input:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3.5px rgba(91,108,255,.14)}
.hdr-search .clr{position:absolute;right:8px;width:22px;height:22px;border-radius:50%;display:none;place-items:center;color:var(--text-3);font-size:13px}
.hdr-search.has-val .clr{display:grid}
.hdr-search .clr:hover{background:var(--surface-3);color:var(--text)}
.iconbtn{width:36px;height:36px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;font-size:16px;
  color:var(--text-2);border:1px solid transparent;transition:.15s;position:relative}
.iconbtn:hover{background:var(--surface-3);color:var(--text)}
.iconbtn.on{background:var(--brand-soft);color:var(--brand);border-color:rgba(91,108,255,.28)}
.pill{height:32px;padding:0 12px;border-radius:20px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  font-weight:600;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);transition:.15s;white-space:nowrap}
.pill:hover{border-color:var(--border-strong);color:var(--text)}
.pill.admin{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(91,108,255,.32)}
.pill.guest{background:var(--surface-3);color:var(--text-3)}

/* ---------- layout ---------- */
.body{flex:1;display:flex;min-height:0;position:relative}
.side{width:250px;flex:0 0 250px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
/* 侧栏布局说明：
   外层 .side-scroll 不再整块滚动，改为「全部」区块固定、分类与标签各自滚动。
   这样分类再多也不会把「管理分类」按钮和「标签」区顶出视野。
   外层保留 overflow-y:auto 作为最后兜底 —— 只有内容确实溢出且子块都撑满时才滚动。 */
.side-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 10px 14px;
  display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.side-sec{margin-bottom:0;display:flex;flex-direction:column;min-height:0}
/* 需要占满剩余高度并可独立滚动的区块 */
.side-sec.sec-flex{flex:1 1 auto;min-height:0}
/* 区块折叠：整块的标题栏始终可见，点标题栏即可折叠/展开 */
.sec-body{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1 1 auto}
.sec-body.hide{display:none}
/* 独立滚动容器 —— 分类过多时在这里上下滑动，不影响侧栏其它部分 */
.scroll-box{
  overflow-y:auto;overflow-x:hidden;min-height:56px;
  /* 兜底高度上限：不依赖祖先链是否解析出确定高度。
     即使 flex 布局失效，分类列表也不会无限变高、把「标签」区顶出屏幕。 */
  max-height:calc(100dvh - var(--header-h) - 320px);
  padding-right:3px;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent;
}
/* 老浏览器不支持 dvh 时用 vh 兜底（写在前面，被支持的浏览器会用后面的覆盖） */
@supports not (height:100dvh){ .scroll-box{max-height:calc(100vh - var(--header-h) - 320px)} }
/* 同时给一个绝对下限，保证「全部」区块等占位后仍有可用高度 */
.scroll-box{min-height:56px}
.scroll-box.box-tags{max-height:22vh;min-height:44px}
.side-sec.sec-flex>.sec-body>.scroll-box{
  flex:1 1 auto;height:100%;
  /* 优先用 flex 轨道高度；同时用 min() 叠加一个绝对上限，
     两者取小 —— 无论哪种机制先失效，都还有另一个兜住。 */
  max-height:min(52vh, calc(100dvh - var(--header-h) - 300px));
}
.scroll-box::-webkit-scrollbar{width:8px}
.scroll-box::-webkit-scrollbar-track{background:transparent}
.scroll-box::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:content-box}
.scroll-box::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
/* 收尾处的渐隐，暗示「下面还有内容」。
   用 wrapper 的 ::after 绝对定位在滚动容器底部，比在滚动内容里 sticky 更可靠
   （sticky 在 flex 滚动容器里的行为各浏览器不一致，且会随内容滚走）。 */
.scroll-box{position:relative}
.scroll-wrap{position:relative;display:flex;flex-direction:column;min-height:0;flex:1 1 auto}
.scroll-wrap.more::after{
  content:'';position:absolute;left:0;right:8px;bottom:0;height:22px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,0),var(--surface) 78%);
  border-radius:0 0 8px 8px
}
html[data-theme="dark"] .scroll-wrap.more::after{
  background:linear-gradient(to bottom,rgba(0,0,0,0),var(--surface) 78%)
}
.side-sec-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 6px;font-size:11px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-3)}
/* 可点击的区块标题（折叠开关） */
.hd-toggle{
  display:flex;align-items:center;gap:6px;flex:1;min-width:0;cursor:pointer;
  background:transparent;border:0;padding:3px 4px;border-radius:7px;
  font:inherit;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:inherit;text-align:left
}
.hd-toggle:hover{background:var(--surface-2);color:var(--text-2)}
.hd-toggle .tgl-ico{font-size:10px;line-height:1;color:var(--text-3);transition:transform .18s;flex:0 0 auto}
.hd-toggle[aria-expanded="false"] .tgl-ico{transform:rotate(-90deg)}
.hd-toggle .hd-cnt{
  font-size:10px;font-weight:700;letter-spacing:0;text-transform:none;
  background:var(--surface-3);color:var(--text-3);padding:0 6px;border-radius:20px
}
/* 列表操作条（全部展开 / 全部折叠） */
.list-tools{display:flex;align-items:center;gap:6px;padding:2px 6px 0;font-size:11px;color:var(--text-3)}
.tl-btn{background:transparent;border:0;padding:2px 4px;border-radius:6px;cursor:pointer;
  font-size:11px;font-weight:650;color:var(--text-3);transition:.15s}
.tl-btn:hover{color:var(--brand);background:var(--brand-soft)}
.tl-dot{color:var(--border-strong);user-select:none}
.side-sec-hd .mini{font-size:14px;padding:2px 6px;border-radius:6px;color:var(--text-3)}
.side-sec-hd .mini:hover{background:var(--surface-3);color:var(--brand)}
/* 明确的文字型「管理」入口（取代含义模糊的齿轮图标） */
.side-sec-hd .mini-txt{font-size:11px;font-weight:700;letter-spacing:0;text-transform:none;
  padding:3px 9px;border-radius:20px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text-2);transition:.15s;white-space:nowrap}
.side-sec-hd .mini-txt:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.nav-item.add-cat{margin-top:5px;border:1px dashed var(--border-strong);color:var(--text-2);
  background:transparent;font-weight:600}
.nav-item.add-cat:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.nav-item.add-cat .em{font-size:14px}
/* 工具栏里的分类管理按钮（手机上一眼可见） */
#btnMgrCatTb{flex:0 0 auto}
@media(max-width:720px){
  #btnMgrCatTb .txt{display:none}   /* 窄屏只留图标，省空间 */
}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:10px;font-size:13.5px;
  color:var(--text-2);text-align:left;transition:.13s;margin-bottom:1px}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:650}
.nav-item .em{font-size:14.5px;width:18px;text-align:center;flex:0 0 auto}
.nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .ct{font-size:11px;font-weight:600;color:var(--text-3);background:var(--surface-3);padding:1px 6px;border-radius:20px}
/* 二级分类个数徽标（比联系人计数更淡，避免抢眼） */
.nav-item .sub-ct{font-size:10px;font-weight:650;color:var(--text-3);opacity:.75;
  border:1px solid var(--border);padding:0 5px;border-radius:20px;flex:0 0 auto}
.nav-item.active .sub-ct{border-color:rgba(91,108,255,.35);color:var(--brand);opacity:1}
.nav-item.active .ct{background:rgba(91,108,255,.16);color:var(--brand)}
.nav-sub{padding-left:12px;margin-left:12px;border-left:1.5px solid var(--border)}
.nav-sub .nav-item{padding:6px 10px;font-size:12.5px}
/* ---- 可折叠的分类分组（一级分类点箭头折叠其下的二级分类） ---- */
.cat-block{margin-bottom:2px}
.cat-row{display:flex;align-items:center;gap:2px;min-width:0}
.cat-row>.nav-item{flex:1;min-width:0}
/* 折叠箭头按钮 */
.cat-tgl{
  flex:0 0 auto;width:20px;height:20px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;padding:0;border-radius:6px;cursor:pointer;
  color:var(--text-3);font-size:9px;line-height:1;transition:.15s
}
.cat-tgl:hover{background:var(--surface-3);color:var(--brand)}
.cat-tgl .arw{display:inline-block;transition:transform .18s}
.cat-block[data-open="0"] .cat-tgl .arw{transform:rotate(-90deg)}
/* 没有二级分类时占位，保持一级分类文字左对齐 */
.cat-tgl.ph{visibility:hidden;pointer-events:none}
/* 折叠时隐藏二级列表 */
.cat-block[data-open="0"]>.nav-sub{display:none}
/* 二级分类列表：自己也能滚（单个分类下二级项特别多时） */
.nav-sub{max-height:230px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.nav-sub::-webkit-scrollbar{width:7px}
.nav-sub::-webkit-scrollbar-track{background:transparent}
.nav-sub::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;border:2px solid transparent;background-clip:content-box}
.nav-sub::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
/* 二级分类里再多也保留「该分类本身」的可见性 */
.nav-sub .nav-item .nm{font-weight:550}
/* 当前正在查看的分类：即使其二级列表被折叠，也在父行上给出明确标识 */
.cat-block[data-open="0"]>.cat-row>.nav-item:not(.active){opacity:.9}
.tag-cloud{display:flex;flex-wrap:wrap;gap:6px;padding:2px 8px}
.tag-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;
  font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);transition:.14s}
.tag-chip:hover{transform:translateY(-1px)}
.tag-chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.empty-hint{padding:10px 12px;font-size:12px;color:var(--text-3);line-height:1.7}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.toolbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border);
  background:var(--bg);flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);flex-wrap:wrap;min-width:0}
.crumbs b{color:var(--text);font-weight:650}
.crumbs .sep{color:var(--text-3);opacity:.6}
.tb-spacer{flex:1;min-width:8px}
.tb-count{font-size:12.5px;color:var(--text-3);white-space:nowrap}
.btn{height:34px;padding:0 13px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;
  font-weight:600;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:.15s;
  white-space:nowrap;box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--border-strong);color:var(--text);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;box-shadow:0 3px 12px rgba(91,108,255,.3)}
.btn.primary:hover{box-shadow:0 6px 18px rgba(91,108,255,.4)}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.danger{color:var(--danger);border-color:rgba(239,77,90,.3)}
.btn.danger:hover{background:rgba(239,77,90,.08)}
.btn.sm{height:29px;padding:0 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;pointer-events:none}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-3);transition:.14s}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-sm)}
.selbar{flex:0 0 auto;display:none;align-items:center;gap:10px;padding:9px 16px;
  background:linear-gradient(90deg,rgba(91,108,255,.10),rgba(139,92,246,.07));
  border-bottom:1px solid rgba(91,108,255,.24);flex-wrap:wrap}
.selbar.show{display:flex}
.selbar .n{font-size:13px;font-weight:700;color:var(--brand)}
.content{flex:1;overflow-y:auto;padding:16px;min-height:0;position:relative}

/* ---------- cards ---------- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
@media(max-width:560px){.grid{grid-template-columns:1fr;gap:10px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;
  display:flex;gap:12px;align-items:flex-start;cursor:pointer;transition:transform .16s,box-shadow .16s,border-color .16s;
  position:relative;overflow:hidden;box-shadow:var(--shadow-sm);text-align:left;width:100%}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.card.selected{border-color:var(--brand);background:linear-gradient(135deg,rgba(91,108,255,.055),rgba(139,92,246,.03));
  box-shadow:inset 0 0 0 2px var(--brand)}
.ava{width:44px;height:44px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;font-weight:700;
  font-size:16px;color:#fff;letter-spacing:.5px;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.lg{width:76px;height:76px;border-radius:22px;font-size:27px}
.c-body{flex:1;min-width:0}
.c-name{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:5px;line-height:1.35}
.c-name .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name .star{color:#f6b93b;font-size:12px;flex:0 0 auto}
.c-phone{font-size:13px;color:var(--text-2);margin-top:4px;display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.c-phone .ph-ic{font-size:11px;color:var(--brand);opacity:.85}
.c-org{font-size:11.5px;color:var(--text-3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.mini-tag{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:20px;line-height:1.5}
.c-cat{font-size:10.5px;color:var(--text-3);margin-top:8px}
.check{position:absolute;top:10px;right:10px;width:19px;height:19px;border-radius:6px;border:1.8px solid var(--border-strong);
  background:var(--surface);display:none;place-items:center;font-size:11px;color:#fff;transition:.14s;z-index:2}
body.selmode .check{display:grid}
.card.selected .check{background:var(--brand);border-color:var(--brand)}

.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);cursor:pointer;transition:.14s;box-shadow:var(--shadow-sm);width:100%;text-align:left}
.row:hover{border-color:var(--border-strong);transform:translateX(2px);box-shadow:var(--shadow-md)}
.row.selected{border-color:var(--brand);background:linear-gradient(90deg,rgba(91,108,255,.06),transparent)}
.row .ava{width:36px;height:36px;border-radius:11px;font-size:13.5px}
.row .r-name{font-weight:620;font-size:14px;min-width:110px;flex:0 1 190px;display:flex;align-items:center;gap:5px}
.row .r-name .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r-phone{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;flex:0 0 auto;min-width:126px}
.row .r-org{font-size:12px;color:var(--text-3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row .r-tags{display:flex;gap:4px;flex:0 0 auto;max-width:190px;overflow:hidden}
.row .check{position:static;display:none;flex:0 0 auto}
body.selmode .row .check{display:grid}
@media(max-width:760px){
  .row{flex-wrap:wrap;gap:6px 10px}
  .row .r-phone{min-width:0;order:3;font-size:12.5px;color:var(--text-3)}
  .row .r-org{order:4;flex-basis:100%;font-size:11.5%}
  .row .r-tags{display:none}
}
.alpha-hd{position:sticky;top:-1px;z-index:5;padding:7px 2px 6px;margin:14px 0 8px;font-size:12px;font-weight:800;
  letter-spacing:1.4px;color:var(--brand);background:linear-gradient(var(--bg) 62%,transparent)}
.alpha-hd:first-child{margin-top:0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:70px 24px;
  text-align:center;color:var(--text-3)}
.empty .ic{font-size:48px;opacity:.5}
.empty h3{margin:0;font-size:16px;color:var(--text-2);font-weight:650}
.empty p{margin:0;font-size:13px;max-width:400px;line-height:1.75}

/* ---------- overlay ---------- */
.mask{position:fixed;inset:0;background:rgba(18,24,42,.46);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  z-index:200;display:none;opacity:0;transition:opacity .2s}
.mask.show{display:block;opacity:1}
html[data-theme="dark"] .mask{background:rgba(0,0,0,.62)}
.detail-wrap{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;padding:20px}
.detail-wrap.show{display:flex}
.detail{width:min(480px,100%);max-height:min(88dvh,860px);background:var(--surface);border-radius:var(--r-xl);
  box-shadow:var(--shadow-xl);overflow:hidden;display:flex;flex-direction:column;
  transform:scale(.94) translateY(14px);opacity:0;transition:transform .26s cubic-bezier(.2,.9,.3,1.15),opacity .2s}
.detail-wrap.show .detail{transform:scale(1) translateY(0);opacity:1}
.d-hero{padding:26px 24px 20px;text-align:center;position:relative;flex:0 0 auto;
  background:linear-gradient(150deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff}
.d-hero::after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.13)}
.d-hero .ava{margin:0 auto 12px;box-shadow:0 8px 24px rgba(0,0,0,.22);position:relative;z-index:2}
.d-hero h2{margin:0;font-size:20px;font-weight:700;position:relative;z-index:2;letter-spacing:.3px}
.d-hero .d-sub{font-size:12.5px;opacity:.9;margin-top:5px;position:relative;z-index:2}
.d-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);
  color:#fff;display:grid;place-items:center;font-size:15px;z-index:5;transition:.15s}
.d-close:hover{background:rgba(255,255,255,.32);transform:rotate(90deg)}
.d-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;position:relative;z-index:2;flex-wrap:wrap}
.d-actions button{height:32px;padding:0 13px;border-radius:9px;font-size:12.5px;font-weight:650;
  background:rgba(255,255,255,.2);color:#fff;display:inline-flex;align-items:center;gap:5px;transition:.15s;
  backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.24)}
.d-actions button:hover{background:rgba(255,255,255,.34)}
.d-body{flex:1;overflow-y:auto;padding:18px 22px 26px}
.d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.d-group{margin-bottom:18px}
.d-group-hd{font-size:10.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--text-3);
  margin-bottom:9px;display:flex;align-items:center;gap:7px}
.d-group-hd::after{content:'';flex:1;height:1px;background:var(--border)}
.d-item{display:flex;align-items:flex-start;gap:11px;padding:9px 11px;border-radius:var(--r-md);background:var(--surface-2);
  margin-bottom:6px;transition:.14s;border:1px solid transparent;text-decoration:none;color:inherit}
.d-item:hover{background:var(--surface-3);border-color:var(--border)}
.d-item .di-lb{font-size:11.5px;color:var(--text-3);flex:0 0 62px;padding-top:1px;font-weight:600}
.d-item .di-vl{flex:1;font-size:13.5px;word-break:break-all;line-height:1.55;min-width:0;color:var(--text)}
.d-item.copyable{cursor:pointer}
.d-item.copyable:active{transform:scale(.985)}
.d-item .cp{font-size:11px;color:var(--text-3);opacity:0;transition:.15s;padding-top:2px}
.d-item:hover .cp{opacity:1}
.d-note{font-size:13px;line-height:1.75;color:var(--text-2);white-space:pre-wrap;background:var(--surface-2);
  padding:11px 13px;border-radius:var(--r-md);border:1px solid var(--border)}

.modal-wrap{position:fixed;inset:0;z-index:220;display:none;align-items:center;justify-content:center;padding:18px}
.modal-wrap.show{display:flex}
.modal{width:min(640px,100%);max-height:90dvh;background:var(--surface);border-radius:var(--r-xl);
  box-shadow:var(--shadow-xl);display:flex;flex-direction:column;overflow:hidden;
  transform:scale(.95);opacity:0;transition:transform .24s cubic-bezier(.2,.9,.3,1.15),opacity .18s}
.modal-wrap.show .modal{transform:scale(1);opacity:1}
.modal.wide{width:min(880px,100%)}
.modal.narrow{width:min(400px,100%)}
.m-hd{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--border)}
.m-hd h3{margin:0;font-size:15.5px;font-weight:700;flex:1;display:flex;align-items:center;gap:8px}
.m-hd .x{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);font-size:15px}
.m-hd .x:hover{background:var(--surface-3);color:var(--text)}
.m-bd{flex:1;overflow-y:auto;padding:18px;min-height:0}
.m-ft{flex:0 0 auto;display:flex;gap:9px;padding:13px 18px;border-top:1px solid var(--border);background:var(--surface-2);
  justify-content:flex-end;flex-wrap:wrap;align-items:center}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.fgrid .full{grid-column:1/-1}
@media(max-width:600px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>label{font-size:12px;font-weight:650;color:var(--text-2);display:flex;align-items:center;gap:5px}
.fld>label .req{color:var(--danger)}
.fld input,.fld select,.fld textarea{height:38px;padding:0 11px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface-2);outline:none;transition:.15s;width:100%}
.fld textarea{height:auto;min-height:82px;padding:9px 11px;resize:vertical;line-height:1.6}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand);background:var(--surface);
  box-shadow:0 0 0 3.5px rgba(91,108,255,.13)}
.fld .hint{font-size:11px;color:var(--text-3);line-height:1.5}
.fld input[disabled],.fld select[disabled]{opacity:.55;cursor:not-allowed}
.fsec{margin:20px 0 12px;font-size:11.5px;font-weight:800;letter-spacing:1px;color:var(--brand);display:flex;align-items:center;gap:9px}
.fsec::after{content:'';flex:1;height:1px;background:var(--border)}
.fsec:first-child{margin-top:0}
.tagpick{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--border);border-radius:10px;
  background:var(--surface-2);min-height:44px;align-items:flex-start}
.tagpick .tp{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;font-size:12px;
  font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);transition:.14s}
.tagpick .tp.on{color:#fff;border-color:transparent}
.tagpick .add{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;font-size:12px;
  font-weight:600;border:1.5px dashed var(--border-strong);color:var(--text-3)}
.tagpick .add:hover{border-color:var(--brand);color:var(--brand)}
/* 分类管理 */
.cat-row{display:flex;align-items:center;gap:11px;padding:9px 11px;border:1px solid var(--border);
  border-radius:11px;margin-bottom:6px;background:var(--surface);transition:.15s}
.cat-row:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.cat-row.sm{padding:7px 10px;background:var(--surface-2)}
.cat-row .ico{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:17px;background:var(--surface-3)}
.cat-row.sm .ico{width:28px;height:28px;font-size:14px;border-radius:8px}
.cat-row .cmeta{flex:1;min-width:0}
.cat-row .cmeta b{display:block;font-size:13.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-row .cmeta span{font-size:11px;color:var(--text-3);line-height:1.5}
.cat-row .cbtns{display:flex;gap:4px;flex:0 0 auto}
.cat-row .iconbtn[disabled]{opacity:.32;cursor:not-allowed}
.cat-form{margin-top:8px;padding:13px 14px;border:1.5px solid var(--brand);border-radius:var(--r-md);
  background:var(--brand-soft);animation:tin .22s ease}
.cat-form .fld{margin-bottom:11px}
.cat-form .fld:last-of-type{margin-bottom:0}
.icpick{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.icpick .icb{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  font-size:15px;line-height:1;display:grid;place-items:center;transition:.14s}
.icpick .icb:hover{border-color:var(--brand);transform:translateY(-2px)}
.row-btns{display:flex;gap:8px;margin-top:11px}
.iconbtn.danger{color:var(--danger)}
.iconbtn.danger:hover{background:rgba(240,82,82,.1);border-color:var(--danger)}
/* 导入模板：列名预览 chips */
.tpl-cols{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding:9px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface-2)}
.tpl-col{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);white-space:nowrap}
.tpl-col.star{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.tpl-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--border);
  border-radius:var(--r-md);background:var(--surface);margin-bottom:8px;transition:.15s}
.tpl-item:hover{border-color:var(--brand);box-shadow:var(--shadow-sm)}
.tpl-item .ext{flex:0 0 auto;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;
  font-size:10px;font-weight:800;letter-spacing:.3px;color:#fff;background:var(--brand)}
.tpl-item .meta{flex:1;min-width:0}
.tpl-item .meta b{display:block;font-size:13px;margin-bottom:2px}
.tpl-item .meta span{font-size:11.3px;color:var(--text-3);line-height:1.5}
.map-row{display:flex;align-items:center;gap:7px;padding:6px 9px;border-bottom:1px solid var(--border);font-size:12px}
.map-row:last-child{border-bottom:0}
.map-row .src{font-weight:650;color:var(--text);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-row .arw{color:var(--text-3);flex:0 0 auto}
.map-row .dst{color:var(--brand);font-weight:600}
.map-row .dst.none{color:var(--text-3);font-weight:500}
.drop{border:2px dashed var(--border-strong);border-radius:var(--r-lg);padding:32px 20px;text-align:center;
  background:var(--surface-2);transition:.18s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .ic{font-size:38px;margin-bottom:10px;opacity:.7}
.drop h4{margin:0 0 6px;font-size:14.5px;font-weight:650}
.drop p{margin:0;font-size:12.5px;color:var(--text-3);line-height:1.7}
.fmt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
@media(max-width:560px){.fmt-grid{grid-template-columns:1fr}}
.fmt{padding:13px 12px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface);text-align:left;transition:.15s}
.fmt:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.fmt b{display:block;font-size:13px;margin-bottom:3px}
.fmt span{font-size:11px;color:var(--text-3);line-height:1.5;display:block}
.fmt.rec{border-color:var(--brand);background:var(--brand-soft)}
.tbl-wrap{border:1px solid var(--border);border-radius:var(--r-md);overflow:auto;max-height:300px}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
table.tbl th{position:sticky;top:0;background:var(--surface-3);padding:8px 10px;text-align:left;font-weight:700;
  font-size:11.5px;color:var(--text-2);border-bottom:1px solid var(--border);white-space:nowrap;z-index:2}
table.tbl td{padding:7px 10px;border-bottom:1px solid var(--border);color:var(--text-2);max-width:230px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tr:hover td{background:var(--surface-2)}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;
  gap:8px;align-items:center;pointer-events:none;width:min(94vw,430px)}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:13px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:13.2px;
  font-weight:600;color:var(--text);animation:tin .3s cubic-bezier(.2,.9,.3,1.2);width:100%}
.toast .ti{font-size:15px;flex:0 0 auto}
.toast.ok .ti{color:var(--ok)} .toast.err .ti{color:var(--danger)}
.toast.warn .ti{color:var(--warn)} .toast.info .ti{color:var(--info)}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
.sw{position:relative;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--text-2);font-weight:600}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw .track{width:40px;height:23px;border-radius:20px;background:var(--border-strong);transition:.2s;flex:0 0 auto;position:relative}
.sw .track::after{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.24)}
.sw input:checked+.track{background:var(--brand)}
.sw input:checked+.track::after{transform:translateX(17px)}
.side-back{position:fixed;inset:0;background:rgba(18,24,42,.42);z-index:69;display:none;backdrop-filter:blur(2px)}
.side-back.show{display:block}
html[data-theme="dark"] .side-back{background:rgba(0,0,0,.6)}
.spin{width:17px;height:17px;border-radius:50%;border:2.2px solid rgba(255,255,255,.32);border-top-color:#fff;
  animation:sp .7s linear infinite;display:inline-block}
.spin.dark{border-color:var(--border-strong);border-top-color:var(--brand)}
@keyframes sp{to{transform:rotate(360deg)}}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px;
  background:var(--surface-3);color:var(--text-3);white-space:nowrap}
.conn .d{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:0 0 auto}
.conn.ok{background:rgba(16,185,129,.13);color:#0e9d76}
.conn.ok .d{background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.conn.err{background:rgba(239,77,90,.11);color:var(--danger)}
.conn.err .d{background:var(--danger)}
.conn.local{background:rgba(245,166,35,.14);color:#c9860f}
.conn.local .d{background:var(--warn)}
.note{font-size:12.4px;line-height:1.8;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);
  border-left:3px solid var(--brand);border-radius:10px;padding:11px 13px}
.note.warn{border-left-color:var(--warn);background:rgba(245,166,35,.07)}
.note.ok{border-left-color:var(--ok);background:rgba(16,185,129,.07)}
.note.err{border-left-color:var(--danger);background:rgba(239,77,90,.06)}
.note code{background:var(--surface-3);padding:1px 5px;border-radius:5px;font-size:11.5px;
  font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.note pre{margin:8px 0 0;padding:10px;background:var(--surface-3);border-radius:8px;overflow:auto;
  font-size:11px;line-height:1.6;max-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---- 可折叠区块（vCard 字段说明用） ---- */
.acc{margin:0 0 9px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);
  overflow:hidden;transition:border-color .15s}
.acc:hover{border-color:var(--border-strong)}
.acc[open]{border-color:var(--brand)}
.acc>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:11px 13px;
  font-size:13.2px;font-weight:700;color:var(--text);user-select:none;transition:background .15s}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::before{content:'▸';flex:0 0 auto;font-size:12px;color:var(--text-3);transition:transform .2s}
.acc[open]>summary::before{transform:rotate(90deg);color:var(--brand)}
.acc>summary:hover{background:var(--surface-2)}
.acc[open]>summary{background:var(--brand-soft);border-bottom:1px solid var(--border)}
.acc .badge{flex:0 0 auto;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:2px 8px;
  border-radius:20px;background:var(--surface-3);color:var(--text-2)}
.acc[open] .badge.v21{background:rgba(245,166,35,.18);color:#b57400}
.acc[open] .badge.v30{background:rgba(91,108,255,.16);color:var(--brand)}
.acc[open] .badge.v40{background:rgba(16,185,129,.16);color:#0a8f6a}
html[data-theme="dark"] .acc[open] .badge.v21{color:#f5c05a}
html[data-theme="dark"] .acc[open] .badge.v40{color:#4ade80}
.acc .cnt{margin-left:auto;flex:0 0 auto;font-size:11px;color:var(--text-3);font-weight:600}
.acc-bd{padding:12px 13px}

/* vCard 字段表 */
.vc-tbl{width:100%;border-collapse:collapse;font-size:11.8px;line-height:1.65}
.vc-tbl th{text-align:left;padding:7px 9px;background:var(--surface-3);color:var(--text-2);
  font-size:11px;font-weight:800;letter-spacing:.3px;white-space:nowrap;
  border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
.vc-tbl td{padding:7px 9px;border-bottom:1px solid var(--border);color:var(--text-2);vertical-align:top}
.vc-tbl tr:last-child td{border-bottom:0}
.vc-tbl tbody tr:hover td{background:var(--surface-2)}
.vc-tbl .fname{font-weight:700;color:var(--text);white-space:nowrap}
.vc-tbl code{background:var(--surface-3);padding:1px 5px;border-radius:5px;font-size:11px;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--brand);word-break:break-all}
.vc-tbl .req{color:var(--danger);font-weight:800}
.vc-tbl .opt{color:var(--text-3)}
.vc-wrap{border:1px solid var(--border);border-radius:10px;overflow:auto;max-height:420px}
.vc-legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 10px;font-size:11.5px;color:var(--text-3)}
.vc-legend b{color:var(--danger)}
.rules{margin:0;padding-left:19px;font-size:12.3px;line-height:1.95;color:var(--text-2)}
.rules li{margin-bottom:2px}
.rules code{background:var(--surface-3);padding:1px 5px;border-radius:5px;font-size:11.2px;
  font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--brand)}
.rules b{color:var(--text)}
pre.code{margin:0;padding:11px 12px;background:var(--surface-3);border:1px solid var(--border);border-radius:9px;
  overflow:auto;font-size:11.2px;line-height:1.72;color:var(--text-2);
  font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre}
html[data-theme="dark"] pre.code{background:#0e1526}

/* 页脚署名（弹窗内「关于」页签用） */
.credit{margin:22px 0 4px;padding:16px 14px;text-align:center;border-top:1px solid var(--border);
  background:linear-gradient(180deg,transparent,var(--surface-2))}
.credit .ln1{font-size:12.5px;color:var(--text-3);margin-bottom:6px;letter-spacing:.5px}
.credit .ln2{font-size:15px;font-weight:800;color:var(--text);letter-spacing:.6px}
.credit .ln2 .sep{color:var(--text-3);font-weight:400;margin:0 9px}
.credit .ln2 .wx{color:var(--brand);font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.credit .brandline{display:inline-flex;align-items:center;gap:8px;justify-content:center}
.credit .dot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:0 0 auto}
/* 页面级页脚署名：固定在主区域底部，任何时候都能看到 */
.page-credit{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--surface);

/* 内置云端连接（Supabase 项目已建表并验证通过）。留空则退化为纯本地模式。
   如需换成自己的项目，把网址里的 localStorage 清掉或直接在「设置→数据库」里改。 */
const DFLT_SUPABASE_URL='https://fyqhhtsecfeuiogoqitq.supabase.co';
const DFLT_SUPABASE_KEY='sb_publishable_FOBPAY3J4_ttGIUjhlO-Gg_N9FtauPJ';
const DEFAULT_ADMIN_PW_LABEL='02468#abAB';
const SCHEMA_SQL = "-- ============================================================\n--  通讯录 (Contacts / Address Book) — Supabase 建表脚本\n--  使用方式：Supabase 控制台 → SQL Editor → 粘贴全部 → Run\n--  项目：gongqizi2@126.com's Project （账号3）\n-- ============================================================\n\n-- ------------------------------------------------------------\n-- 0. 扩展\n-- ------------------------------------------------------------\ncreate extension if not exists \"pgcrypto\";\n\n-- ------------------------------------------------------------\n-- 1. 一级分类 (categories)\n-- ------------------------------------------------------------\ncreate table if not exists public.categories (\n  id          uuid primary key default gen_random_uuid(),\n  name        text not null,\n  icon        text default '📁',\n  sort_order  int  default 0,\n  created_at  timestamptz default now(),\n  unique (name)\n);\n\n-- ------------------------------------------------------------\n-- 2. 二级分类 (subcategories)\n-- ------------------------------------------------------------\ncreate table if not exists public.subcategories (\n  id           uuid primary key default gen_random_uuid(),\n  category_id  uuid not null references public.categories(id) on delete cascade,\n  name         text not null,\n  sort_order   int  default 0,\n  created_at   timestamptz default now(),\n  unique (category_id, name)\n);\n\n-- ------------------------------------------------------------\n-- 3. 标签 (tags)\n-- ------------------------------------------------------------\ncreate table if not exists public.tags (\n  id          uuid primary key default gen_random_uuid(),\n  name        text not null unique,\n  color       text default '#6b7cff',\n  created_at  timestamptz default now()\n);\n\n-- ------------------------------------------------------------\n-- 4. 联系人 (contacts) — 完整 vCard 字段\n-- ------------------------------------------------------------\ncreate table if not exists public.contacts (\n  id               uuid primary key default gen_random_uuid(),\n\n  -- 姓名\n  last_name        text default '',      -- N 姓氏\n  first_name       text default '',      -- N 名字\n  middle_name      text default '',\n  prefix           text default '',      -- 称谓 先生/女士\n  suffix           text default '',\n  formatted_name   text default '',      -- FN 全名（展示用）\n  nickname         text default '',      -- NICKNAME\n\n  -- 联系方式\n  phone_mobile     text default '',      -- 手机\n  phone_work       text default '',      -- 工作电话\n  phone_home       text default '',      -- 住宅电话\n  phone_fax        text default '',\n  email            text default '',\n  email_work       text default '',\n  website          text default '',\n\n  -- 单位\n  org              text default '',      -- 公司/组织\n  department       text default '',      -- 部门\n  job_title        text default '',      -- 职位\n\n  -- 地址\n  address_street   text default '',\n  address_city     text default '',\n  address_region   text default '',      -- 省/州\n  address_zip      text default '',\n  address_country  text default '',\n\n  -- 生日 / 备注\n  birthday         text default '',\n  note             text default '',\n\n  -- 头像\n  avatar_url       text default '',\n\n  -- 分类\n  category_id      uuid references public.categories(id)    on delete set null,\n  subcategory_id   uuid references public.subcategories(id) on delete set null,\n\n  -- 标签（标签名数组，便于 vCard CATEGORIES 直接映射）\n  tag_names        text[] default '{}',\n\n  -- 元数据\n  starred          boolean default false,\n  vcard_version    text default '3.0',\n  sort_order       int default 0,\n  created_at       timestamptz default now(),\n  updated_at       timestamptz default now()\n);\n\ncreate index if not exists contacts_category_idx    on public.contacts (category_id);\ncreate index if not exists contacts_subcategory_idx on public.contacts (subcategory_id);\ncreate index if not exists contacts_name_idx        on public.contacts (formatted_name);\ncreate index if not exists contacts_tags_idx        on public.contacts using gin (tag_names);\n\n-- 自动维护 updated_at\ncreate or replace function public.touch_updated_at()\nreturns trigger language plpgsql as $$\nbegin\n  new.updated_at = now();\n  return new;\nend $$;\n\ndrop trigger if exists contacts_touch on public.contacts;\ncreate trigger contacts_touch before update on public.contacts\n  for each row execute function public.touch_updated_at();\n\n-- ------------------------------------------------------------\n-- 5. 设置表 (app_settings) — 存\"管理员密码哈希\"等\n--    存放于数据库，这样各设备/浏览器看到的管理员密码一致\n-- ------------------------------------------------------------\ncreate table if not exists public.app_settings (\n  key        text primary key,\n  value      text,\n  updated_at timestamptz default now()\n);\n\n-- ------------------------------------------------------------\n-- 6. 权限：匿名(anon)可读，写操作交给前端管理员密码校验\n--    说明：本项目为「单人自建通讯录」，未接 Supabase Auth 登录。\n--    因此采用 anon key + RLS 允许读写（应用层用管理员密码把关）。\n--    如果你希望更严格，请把下面的写策略改成 false，改用 Service Role。\n-- ------------------------------------------------------------\nalter table public.categories   enable row level security;\nalter table public.subcategories enable row level security;\nalter table public.tags         enable row level security;\nalter table public.contacts     enable row level security;\nalter table public.app_settings enable row level security;\n\n-- 读：匿名可读\ndrop policy if exists \"read_all_categories\" on public.categories;\ncreate policy \"read_all_categories\" on public.categories for select using (true);\n\ndrop policy if exists \"read_all_subcategories\" on public.subcategories;\ncreate policy \"read_all_subcategories\" on public.subcategories for select using (true);\n\ndrop policy if exists \"read_all_tags\" on public.tags;\ncreate policy \"read_all_tags\" on public.tags for select using (true);\n\ndrop policy if exists \"read_all_contacts\" on public.contacts;\ncreate policy \"read_all_contacts\" on public.contacts for select using (true);\n\ndrop policy if exists \"read_all_settings\" on public.app_settings;\ncreate policy \"read_all_settings\" on public.app_settings for select using (true);\n\n-- 写：匿名可写（应用层用管理员密码校验；如需收紧改成 using(false)）\ndrop policy if exists \"write_categories\" on public.categories;\ncreate policy \"write_categories\" on public.categories for all using (true) with check (true);\n\ndrop policy if exists \"write_subcategories\" on public.subcategories;\ncreate policy \"write_subcategories\" on public.subcategories for all using (true) with check (true);\n\ndrop policy if exists \"write_tags\" on public.tags;\ncreate policy \"write_tags\" on public.tags for all using (true) with check (true);\n\ndrop policy if exists \"write_contacts\" on public.contacts;\ncreate policy \"write_contacts\" on public.contacts for all using (true) with check (true);\n\ndrop policy if exists \"write_settings\" on public.app_settings;\ncreate policy \"write_settings\" on public.app_settings for all using (true) with check (true);\n\n-- ------------------------------------------------------------\n-- 7. 初始数据（可重复执行）\n-- ------------------------------------------------------------\ninsert into public.categories (name, icon, sort_order) values\n  ('家人', '🏠', 1),\n  ('朋友', '🍻', 2),\n  ('同事', '💼', 3),\n  ('客户', '🤝', 4),\n  ('其他', '📦', 99)\non conflict (name) do nothing;\n\n-- 二级分类示例\ninsert into public.subcategories (category_id, name, sort_order)\nselect c.id, v.name, v.sort_order\nfrom public.categories c\njoin (values ('家人','直系',1), ('家人','亲戚',2),\n             ('朋友','同学',1),  ('朋友','邻居',2),\n             ('同事','本部门',1),('同事','跨部门',2),\n             ('客户','重点客户',1),('客户','潜在客户',2)) as v(cat, name, sort_order)\n  on v.cat = c.name\non conflict (category_id, name) do nothing;\n\ninsert into public.tags (name, color) values\n  ('重要', '#ff5d73'),\n  ('常联系', '#22c1a4'),\n  ('待跟进', '#f5a623')\non conflict (name) do nothing;\n\n-- ------------------------------------------------------------\n-- 8. 管理员密码 —— 默认写一份到 app_settings\n--    默认密码：02468#abAB  （SHA-256 哈希，前端比对同一算法）\n--    如需改密码：把下面 value 换成新密码的 sha256 十六进制小写\n-- ------------------------------------------------------------\ninsert into public.app_settings (key, value)\nvalues ('admin_password_hash',\n        encode(digest('02468#abAB', 'sha256'), 'hex'))\non conflict (key) do update set value = excluded.value, updated_at = now();\n\n-- ============================================================\n--  完成。验证：\n--  select count(*) from public.contacts;\n--  select * from public.categories;\n-- ============================================================\n";
const VCARD_VERSIONS=['2.1','3.0','4.0'];

/* ------------------------------ 小工具 ------------------------------ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mq = q => { try{ return !!(window.matchMedia && window.matchMedia(q).matches); }catch(e){ return false; } };
/* fetch 兼容层：老浏览器 / 内嵌 WebView 可能没有 fetch，用 XHR 兜底 */
function httpFetch(url, opts){
  opts = opts || {};
  if (typeof fetch === 'function') return fetch(url, opts);
  return new Promise(function(resolve, reject){
    var x = new XMLHttpRequest();
    x.open(opts.method || 'GET', url, true);
    var h = opts.headers || {};
    Object.keys(h).forEach(function(k){ try{ x.setRequestHeader(k, h[k]); }catch(e){} });
    x.onload = function(){
      var hdrs = x.getAllResponseHeaders() || '';
      resolve({
        ok: x.status >= 200 && x.status < 300,
        status: x.status,
        statusText: x.statusText || '',
        headers: { get: function(n){
          var m = hdrs.match(new RegExp('^' + n + ':\\s*(.+)$', 'im'));
          return m ? m[1].trim() : null; } },
        text: function(){ return Promise.resolve(x.responseText || ''); },
        json: function(){ try{ return Promise.resolve(JSON.parse(x.responseText || 'null')); }catch(e){ return Promise.reject(e); } }
      });
    };
    x.onerror = function(){ reject(new Error('网络请求失败（可能是网络不可达或跨域被拦截）')); };
    x.ontimeout = function(){ reject(new Error('请求超时')); };
    x.send(opts.body != null ? opts.body : null);
  });
}
/* 把网络层异常翻译成「人话」，并尽量给出可操作的建议 */
function netErrMsg(e, url){
  var raw = (e && (e.message || e.name)) || String(e || '未知错误');
  var u = String(url || '');
  var isLocal = /127\.0\.0\.1|localhost|192\.168\.|10\./.test(u);
  var tips = [];
  if (/Failed to fetch|NetworkError|Load failed|ERR_|无法访问|不可达|拒绝/i.test(raw)) {
    tips.push('连不上 Supabase：请检查 Project URL 是否写错（形如 https://xxxx.supabase.co，不要带 /rest/v1）、网络是否可访问 supabase.com。');
  }
  if (/CORS|跨域|blocked|拦截/i.test(raw)) {
    tips.push('可能是浏览器的跨域限制：请直接用浏览器打开本 HTML 文件，不要用 file:// 内嵌 iframe 或某些 App 内置浏览器。');
  }
  if (/timeout|超时/i.test(raw)) {
    tips.push('请求超时：网络较慢或被代理拦截，可稍后重试；若开着代理软件，请把 supabase.co 设为直连。');
  }
  if (/SSL|证书|certificate/i.test(raw)) {
    tips.push('HTTPS 证书校验失败：可能是代理软件在做中间人证书替换。');
  }
  if (isLocal) tips.push('检测到你填的是本地/内网地址，浏览器直连需要该地址可访问。');
  if (!tips.length) tips.push('请检查 Project URL 与 Publishable key 是否正确，以及网络是否可达 supabase.com。');
  return '连接 Supabase 失败（' + raw + '）。' + tips.join(' ');
}

function toast(msg,kind='ok',ms=2600){
  const ic={ok:'✅',err:'⛔',warn:'⚠️',info:'ℹ️'}[kind]||'✅';
  const el=document.createElement('div');

function applyField(card,name,params,val,opt){
  const T=typeSet(params);

    case 'VERSION': card._version=String(val).trim(); break;
    case 'FN': card.formatted_name=val; break;
    case 'N':{

      card.last_name=p[0]||'';card.first_name=p[1]||'';card.middle_name=p[2]||'';
      card.prefix=p[3]||'';card.suffix=p[4]||'';
      break;}
    case 'NICKNAME': card.nickname=val; break;
    case 'ORG':{
      const p=splitUnescaped(val,';').map(vUnesc);
      card.org=p[0]||'';card.department=p[1]||'';

    case 'TITLE': case 'ROLE': card.job_title=card.job_title||val; break;
    case 'X-STARRED': card.starred = !/^(0|false|no)$/i.test(String(val).trim()); break;
    case 'NOTE': card.note=card.note?(card.note+'\n'+val):val; break;
    case 'BDAY': card.birthday=normalizeBday(val); break;
    case 'URL': card.website=card.website||val; break;
    case 'TEL':{
      const v=String(val).trim();if(!v)break;
      if(T.includes('CELL')||T.includes('MOBILE'))card.phone_mobile=card.phone_mobile||v;
      else if(T.includes('FAX'))card.phone_fax=card.phone_fax||v;
      else if(T.includes('WORK'))card.phone_work=card.phone_work||v;
      else if(T.includes('HOME'))card.phone_home=card.phone_home||v;
      else if(hasPref(params)||!card.phone_mobile)card.phone_mobile=card.phone_mobile||v;
      else card.phone_home=card.phone_home||v;
      (card._tels=card._tels||[]).push(v);
      break;}
    case 'EMAIL':{
      const v=String(val).trim();if(!v)break;
      if(T.includes('WORK'))card.email_work=card.email_work||v;
      else card.email=card.email||v;
      (card._mails=card._mails||[]).push(v);
      break;}
    case 'ADR':{
      const p=splitUnescaped(val,';').map(vUnesc);
      const street=[p[1],p[2]].filter(Boolean).join(' ');
      if(!card.address_street){
        card.address_street=street;card.address_city=p[3]||'';
        card.address_region=p[4]||'';card.address_zip=p[5]||'';card.address_country=p[6]||'';

      break;}

      if(opt.isB64){
        let b64=String(opt.rawValue||'').replace(/\s/g,'');
        const ci=b64.indexOf(':'); if(ci>=0)b64=b64.slice(ci+1);
        const ci2=b64.indexOf(':'); if(ci2>=0&&ci2<12)b64=b64.slice(ci2+1);
        if(b64){
          const t=T.find(x=>/^(JPEG|JPG|PNG|GIF|WEBP|BMP)$/.test(x))||'JPEG';
          const mime=t==='PNG'?'image/png':t==='GIF'?'image/gif':t==='WEBP'?'image/webp':'image/jpeg';

        }
      } else if(/^https?:/i.test(String(val).trim())){
        card.avatar_url=String(val).trim();
      } else if(/^data:image\//i.test(String(val).trim())){
        card.avatar_url=String(val).trim();
      }

  const tels=[[c.phone_mobile,['CELL']],[c.phone_work,['WORK']],[c.phone_home,['HOME']],[c.phone_fax,['WORK','FAX']]];

/* 导入时可识别的表头别名（中英文都认，大小写/空格/下划线不敏感） */
const HEADER_ALIASES={
  last_name:['last_name','lastname','surname','familyname','姓','姓氏'],
  first_name:['first_name','firstname','givenname','名','名字'],
  middle_name:['middle_name','middlename','中间名'],

  address_zip:['address_zip','zip','zipcode','postalcode','邮政编码','邮编'],
  address_country:['address_country','country','国家','国家地区','国家/地区'],
  birthday:['birthday','birthdate','bday','dob','生日'],

  subcategory:['subcategory','sub_category','二级分类','子分类'],
};
const normHeader=s=>String(s==null?'':s).trim().toLowerCase().replace(/[\s\-_./\\（）()【】\[\]]/g,'');
const HEADER_LOOKUP={};
Object.keys(HEADER_ALIASES).forEach(k=>HEADER_ALIASES[k].forEach(a=>{
  const n=normHeader(a); if(!HEADER_LOOKUP[n])HEADER_LOOKUP[n]=k;
}));
/* 常见表头 → 字段（补充：含「手机」「电话」字样的一律进 phone_mobile 等） */
function guessField(header){
  const n=normHeader(header);
  if(!n)return null;
  if(HEADER_LOOKUP[n])return HEADER_LOOKUP[n];
  if(/手机|移动|mobile|cell/.test(n))return 'phone_mobile';
  if(/工作电话|办公|workphone|businessphone/.test(n))return 'phone_work';
  if(/住宅|家庭电话|homephone/.test(n))return 'phone_home';
  if(/传真|fax/.test(n))return 'phone_fax';
  if(/工作邮箱|workemail|businessemail/.test(n))return 'email_work';
  if(/邮箱|邮件|mail/.test(n))return 'email';
  if(/网站|网址|url|homepage/.test(n))return 'website';
  if(/部门|dept/.test(n))return 'department';
  if(/职位|职务|position/.test(n))return 'job_title';
  if(/公司|单位|组织|company|org/.test(n))return 'org';
  if(/邮编|zip|postal/.test(n))return 'address_zip';
  if(/省|州|province|region|state/.test(n))return 'address_region';
  if(/城市|city/.test(n))return 'address_city';
  if(/国家|country/.test(n))return 'address_country';
  if(/地址|street|address/.test(n))return 'address_street';
  if(/生日|birth|bday/.test(n))return 'birthday';
  if(/备注|说明|note|remark|comment/.test(n))return 'note';
  if(/标签|tag/.test(n))return 'tag_names';
  if(/二级分类|子分类|subcategory/.test(n))return 'subcategory';
  if(/分类|类别|category/.test(n))return 'category';
  if(/姓|last|surname|family/.test(n))return 'last_name';
  if(/名|first|given/.test(n))return 'first_name';
  if(/昵称|nick/.test(n))return 'nickname';
  if(/头像|avatar|photo/.test(n))return 'avatar_url';
  if(/星标|star|重要/.test(n))return 'starred';
  return null;
}

/* ---------------- CSV 解析（RFC 4180：引号、逗号、换行、双引号转义） ------- */
function parseCSV(text,delim){
  const D=delim||',';
  const s=String(text||'').replace(/^\uFEFF/,'');
  const rows=[];let row=[];let cell='';let i=0;let inQ=false;
  while(i<s.length){
    const ch=s[i];
    if(inQ){
      if(ch==='"'){
        if(s[i+1]==='"'){cell+='"';i+=2;continue;}
        inQ=false;i++;continue;
      }
      cell+=ch;i++;continue;
    }
    if(ch==='"'){inQ=true;i++;continue;}
    if(ch===D){row.push(cell);cell='';i++;continue;}
    if(ch==='\r'){i++;continue;}
    if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';i++;continue;}
    cell+=ch;i++;
  }
  if(cell.length||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
/* 自动嗅探分隔符（逗号 / 制表符 / 分号 / 竖线） */
function sniffDelimiter(text){
  const head=String(text||'').split(/\r?\n/).slice(0,5).join('\n');
  const cands=[',','\t',';','|'];
  let best=',',bestScore=-1;
  cands.forEach(d=>{
    const lines=head.split(/\r?\n/).filter(l=>l.trim());
    if(!lines.length)return;
    const counts=lines.map(l=>l.split(d).length);
    const avg=counts.reduce((a,b)=>a+b,0)/counts.length;
    const varMax=Math.max(...counts)-Math.min(...counts);
    const score=avg>1?(avg-varMax*0.5):0;
    if(score>bestScore){bestScore=score;best=d;}
  });
  return best;
}
function splitLooseLine(line,delim){
  // 简易切分（用于 TXT：非严格 CSV 语义）
  return String(line).split(delim).map(x=>x.trim().replace(/^"(.*)"$/,'$1'));
}

/* ---------------- 行数组 → 联系人对像 ---------------- */
function rowsToContacts(rows,delim){
  if(!rows.length)return {contacts:[],headers:[],unmapped:[]};
  const headers=rows[0].map(h=>String(h==null?'':h).trim());
  const map=headers.map(guessField);
  const unmapped=headers.filter((h,i)=>!map[i]&&h);
  const contacts=[];
  for(let r=1;r<rows.length;r++){
    const cells=rows[r];
    const o={};let has=false;
    map.forEach((k,i)=>{
      if(!k)return;
      let v=String(cells[i]==null?'':cells[i]).trim();
      if(!v)return;
      if(k==='tag_names'||k==='category'||k==='subcategory'){
        o[k]=o[k]||[];
        o[k]=o[k].concat(v.split(/[;,、|]/).map(x=>x.trim()).filter(Boolean));
      }else if(k==='starred'){
        o.starred=/^(1|true|yes|y|是|星标|重要)$/i.test(v);
      }else{
        o[k]=v;
      }
      has=true;
    });
    if(has)contacts.push(o);
  }
  return {contacts,headers,unmapped};
}

/* ---------------- JSON 解析（数组 / {contacts:[]} / 导出包） ---------- */
function parseJSONContacts(text){
  let data;
  try{data=JSON.parse(String(text||'').replace(/^\uFEFF/,''));}
  catch(e){throw new Error('JSON 格式错误：'+e.message);}
  let arr=null;
  if(Array.isArray(data))arr=data;
  else if(data&&Array.isArray(data.contacts))arr=data.contacts;
  else if(data&&Array.isArray(data.data))arr=data.data;
  else if(data&&Array.isArray(data.items))arr=data.items;
  else if(data&&typeof data==='object')arr=[data];
  if(!arr)throw new Error('未找到联系人数组。JSON 应为数组，或形如 {"contacts":[...]}');
  const out=[];
  arr.forEach(raw=>{
    if(!raw||typeof raw!=='object')return;
    const o={};
    // 先用别名表把 key 映射到标准字段
    Object.keys(raw).forEach(k=>{
      const f=guessField(k)||(FIELD_BY_KEY[k]?k:null);
      if(!f)return;
      let v=raw[k];
      if(f==='tag_names'){
        if(Array.isArray(v))o.tag_names=v.map(x=>String(x).trim()).filter(Boolean);
        else if(v!=null&&v!=='')o.tag_names=String(v).split(/[;,、|]/).map(x=>x.trim()).filter(Boolean);
        return;
      }
      if(f==='category'||f==='subcategory'){
        o[f]=Array.isArray(v)?v.map(x=>String(x).trim()).filter(Boolean)
                            :String(v==null?'':v).split(/[;,、|]/).map(x=>x.trim()).filter(Boolean);
        return;
      }
      if(f==='starred'){o.starred=/^(1|true|yes|y|是)$/i.test(String(v))||v===true;return;}
      o[f]=v==null?'':String(v).trim();
    });
    if(Object.keys(o).length)out.push(o);
  });
  return out;
}

/* ---------------- 统一入口：按扩展名/内容自动分流 ---------------- */
function parseImportText(text,filename){
  const name=String(filename||'').toLowerCase();
  const body=String(text||'').replace(/^\uFEFF/,'');
  const trimmed=body.trim();
  if(!trimmed)return {contacts:[],format:'empty',note:'内容为空'};

  // 1) JSON
  if(/\.json$/.test(name)||/^[\[{]/.test(trimmed)){
    try{
      const list=parseJSONContacts(body);
      if(list.length)return {contacts:list,format:'json'};
    }catch(e){
      if(/\.json$/.test(name))throw e;
    }
  }
  // 2) vCard（含 BEGIN:VCARD 就按 vCard 走，最可靠）
  if(/BEGIN:VCARD/i.test(body)||/\.(vcf|vcard)$/.test(name)){
    const cards=parseVCards(body);
    if(cards.length)return {contacts:cards,format:'vcard'};
  }
  // 3) CSV / TSV / TXT —— 有表头就按 CSV 走，否则按「姓名,电话,邮箱」松散解析
  /* 分隔符判定：先按扩展名给出「倾向」，再用嗅探结果校正——
     很多用户会把分号/制表符表格存成 .csv，此时嗅探结果更可信。 */
  const sniffed=sniffDelimiter(body);
  let delim=',';
  if(/\.(tsv|tab)$/.test(name))delim='\t';
  else if(/\.csv$/.test(name))delim=(sniffed&&sniffed!==','?sniffed:',');
  else delim=sniffed;
  /* 嗅探到制表符时，即使扩展名是 .csv 也按 TSV 处理 */
  const isCsv=/\.(csv|tsv|tab)$/.test(name);
  const rows=parseCSV(body,delim);
  if(rows.length>=1){
    const headerMap=rows[0].map(guessField);
    const hit=headerMap.filter(Boolean).length;
    if(isCsv||hit>=2){
      const r=rowsToContacts(rows,delim);
      if(r.contacts.length)return {contacts:r.contacts,format:'csv',headers:r.headers,unmapped:r.unmapped};
    }
    // 松散行：第 1 列姓名，第 2 列电话，第 3 列邮箱，第 4 列公司
    const loose=[];
    rows.forEach(cells=>{
      const vals=cells.map(x=>String(x==null?'':x).trim());
      let parts=vals.filter(Boolean);
      /* 只有一列时，尝试从该列里再拆出「姓名 + 电话 + 邮箱」 */
      if(parts.length===1){
        const one=parts[0];
        const mail=one.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
        const tel=one.match(/(\+?\d[\d\s\-()]{5,})/);
        const nm=one.replace(mail?mail[0]:'','').replace(tel?tel[1]:'','').replace(/[,;|、\s]+/g,' ').trim();
        const c={};
        if(nm)c.formatted_name=nm;
        if(tel)c.phone_mobile=tel[1].replace(/^\s+|\s+$/g,'');
        if(mail)c.email=mail[0];
        if(Object.keys(c).length)loose.push(c);
        return;
      }
      const c={};
      if(parts[0])c.formatted_name=parts[0];
      if(parts[1])c.phone_mobile=parts[1];
      if(parts[2])c.email=parts[2];
      if(parts[3])c.org=parts[3];
      if(parts[4])c.note=parts[4];
      loose.push(c);
    });
    if(loose.length)return {contacts:loose,format:'txt'};
  }
  // 4) 纯文本兜底：每行「姓名 电话」
  const lines=body.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const loose=lines.map(l=>{
    /* 若整行只有一个 token（姓名与电话仅用单空格分隔），先按「第一个空格」拆一次 */
    let parts=l.split(/[\t,;|]|\s{2,}/).map(x=>x.trim()).filter(Boolean);
    if(parts.length===1){
      const m=l.match(/^(.*?)\s+(\+?[\d][\d\s\-()]{4,})$/);
      if(m)parts=[m[1].trim(),m[2].trim()];
    }
    const c={};
    if(parts[0])c.formatted_name=parts[0];
    const rest=parts.slice(1).join(' ');
    const tel=rest.match(/(\+?\d[\d\s\-()]{5,})/);
    if(tel)c.phone_mobile=tel[1].trim();
    const mail=rest.match(/[\w.+-]+@[\w-]+\.[\w.-]+/);
    if(mail)c.email=mail[0];
    return c;
  }).filter(c=>Object.keys(c).length);
  return {contacts:loose,format:'txt'};
}

const ROW_FIELDS=['last_name','first_name','middle_name','prefix','suffix','formatted_name','nickname',
 'phone_mobile','phone_work','phone_home','phone_fax','email','email_work','website',
 'org','department','job_title','address_street','address_city','address_region','address_zip','address_country',
 'birthday','note','avatar_url','category_id','subcategory_id','tag_names','starred','vcard_version','sort_order'];

function toRow(c){
  const o={};
  ROW_FIELDS.forEach(k=>{
    let v=c[k];
    if(k==='tag_names')v=Array.isArray(v)?v:[];
    else if(k==='starred')v=!!v;
    else if(k==='sort_order')v=v||0;
    else if(k==='category_id'||k==='subcategory_id')v=v||null;
    else v=v==null?'':String(v);
    o[k]=v;
  });
  return o;
}
function sanitizeContact(r){
  const c=Object.assign({},r);
  ROW_FIELDS.forEach(k=>{
    if(c[k]===undefined||c[k]===null){
      c[k]=k==='tag_names'?[]:(k==='starred'?false:((k==='category_id'||k==='subcategory_id')?null:''));}
  });
  if(!Array.isArray(c.tag_names))c.tag_names=[];
  if(!c.id)c.id=uid();
  return c;
}

const Store={
  cfg:{url:'',key:'',project:'',email:''},
  mode:'local', online:false, admin:false, err:'',
  state:{categories:[],subcategories:[],tags:[],contacts:[]},

  loadCfg(){
    try{this.cfg=JSON.parse(localStorage.getItem(CFG_KEY)||'null')||{};}catch(e){this.cfg={};}
    ['url','key','project','email'].forEach(k=>{if(this.cfg[k]===undefined)this.cfg[k]='';});
    /* 内置默认云端配置：本机 localStorage 没填过时自动带上，换设备打开即可连上；
       用户在「设置」里改过的值优先级更高（不会被覆盖） */
    if(!this.cfg.url) this.cfg.url=DFLT_SUPABASE_URL;
    if(!this.cfg.key) this.cfg.key=DFLT_SUPABASE_KEY;
    if(!this.cfg.email) this.cfg.email=DFLT_EMAIL;
    if(!this.cfg.project) this.cfg.project=DFLT_PROJECT;
    return this.cfg;
  },
  saveCfg(o){
    this.cfg=Object.assign({},this.cfg,o);
    localStorage.setItem(CFG_KEY,JSON.stringify(this.cfg));
  },
  configured(){return !!(this.cfg&&this.cfg.url&&this.cfg.key);},

  api(path,opts){
    const base=String(this.cfg.url||'').replace(/\/+$/,'');
    const h=Object.assign({
      'apikey':this.cfg.key,
      'Authorization':'Bearer '+this.cfg.key,
      'Content-Type':'application/json'
    },(opts&&opts.headers)||{});
    return httpFetch(base+'/rest/v1/'+path,Object.assign({},opts||{},{headers:h}));
  },
  async apiJSON(path,opts){
    let r;
    try{ r=await this.api(path,opts); }
    catch(e){
      // 网络层失败（DNS 解析不了 / 连接被拒 / 被跨域或代理拦截 / 超时）
      const err=new Error(netErrMsg(e,this.cfg&&this.cfg.url));
      err.network=true;err.cause=e;throw err;
    }
    if(!r.ok){
      let t='';try{t=await r.text();}catch(e){}
      const err=new Error(`HTTP ${r.status} ${r.statusText}`+(t?' — '+t.slice(0,300):''));
      err.status=r.status;err.body=t;throw err;
    }
    if(r.status===204)return null;
    const ct=r.headers.get('content-type')||'';
    if(!ct.includes('json'))return null;
    return r.json();
  },
  async probe(){
    let r;
    try{ r=await this.api('contacts?select=id&limit=1'); }
    catch(e){ throw new Error(netErrMsg(e,this.cfg&&this.cfg.url)); }
    if(!r.ok){let t='';try{t=await r.text();}catch(e){}throw new Error(`HTTP ${r.status}`+(t?' — '+t.slice(0,260):''));}
    return true;
  },
  async loadAll(){
    const [cats,subs,tags,cons]=await Promise.all([
      this.apiJSON('categories?select=*&order=sort_order.asc'),
      this.apiJSON('subcategories?select=*&order=sort_order.asc'),
      this.apiJSON('tags?select=*&order=name.asc'),
      this.apiJSON('contacts?select=*&order=created_at.asc')
    ]);
    this.state.categories=(cats||[]).map(x=>({id:x.id,name:x.name,icon:x.icon||'📁',sort_order:x.sort_order||0}));
    this.state.subcategories=(subs||[]).map(x=>({id:x.id,category_id:x.category_id,name:x.name,sort_order:x.sort_order||0}));
    this.state.tags=(tags||[]).map(x=>({id:x.id,name:x.name,color:x.color||'#6b7cff'}));
    this.state.contacts=(cons||[]).map(sanitizeContact);
  },
  loadLocal(){
    let d=null;
    try{d=JSON.parse(localStorage.getItem(DATA_KEY)||'null');}catch(e){}
    if(!d||!Array.isArray(d.contacts))d={categories:[],subcategories:[],tags:[],contacts:[]};
    if(!d.categories.length&&!d.contacts.length&&!localStorage.getItem(DATA_KEY+'.seeded')){
      d=seedDemo();localStorage.setItem(DATA_KEY+'.seeded','1');
    }
    this.state.categories=d.categories||[];
    this.state.subcategories=d.subcategories||[];
    this.state.tags=d.tags||[];
    this.state.contacts=(d.contacts||[]).map(sanitizeContact);
    this.saveLocal();
  },
  saveLocal(){
    localStorage.setItem(DATA_KEY,JSON.stringify({
      categories:this.state.categories,subcategories:this.state.subcategories,
      tags:this.state.tags,contacts:this.state.contacts}));
  },
  async init(){
    this.loadCfg();
    this.admin=sessionStorage.getItem(SESS_KEY)==='1';
    if(this.configured()){
      this.mode='supabase';
      try{await this.probe();await this.loadAll();this.online=true;this.err='';}
      catch(e){this.online=false;this.mode='local';this.err=e.message||String(e);this.loadLocal();}
    }else{
      this.mode='local';this.online=false;this.loadLocal();
    }
    return this.mode;
  },
  async reload(){
    if(this.mode==='supabase'&&this.online){await this.loadAll();}
    else this.loadLocal();
  },

  /* -------- CRUD -------- */
  async insertContact(c){
    if(this.mode==='supabase'){
      const res=await this.apiJSON('contacts',{method:'POST',
        headers:{'Prefer':'return=representation'},body:JSON.stringify(toRow(c))});
      const row=Array.isArray(res)?res[0]:res;
      const m=sanitizeContact(row);this.state.contacts.push(m);return m;
    }
    c.id=c.id||uid();c.sort_order=c.sort_order||0;
    this.state.contacts.push(c);this.saveLocal();return c;
  },
  async insertContacts(list){
    if(!list.length)return[];
    if(this.mode==='supabase'){
      const out=[];
      for(let i=0;i<list.length;i+=80){
        const res=await this.apiJSON('contacts',{method:'POST',
          headers:{'Prefer':'return=representation'},body:JSON.stringify(list.slice(i,i+80).map(toRow))});
        (Array.isArray(res)?res:[res]).forEach(r=>out.push(sanitizeContact(r)));
      }
      this.state.contacts.push(...out);return out;
    }
    list.forEach(c=>{c.id=c.id||uid();});
    this.state.contacts.push(...list);this.saveLocal();return list;
  },
  async updateContact(id,patch){
    if(this.mode==='supabase'){
      const p=Object.assign({},patch);delete p.id;delete p.created_at;
      const res=await this.apiJSON('contacts?id=eq.'+encodeURIComponent(id),
        {method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(p)});
      const row=Array.isArray(res)?res[0]:res;
      const m=sanitizeContact(row);
      const i=this.state.contacts.findIndex(x=>x.id===id);
      if(i>=0)this.state.contacts[i]=m;
      return m;
    }
    const i=this.state.contacts.findIndex(x=>x.id===id);
    if(i>=0){this.state.contacts[i]=Object.assign({},this.state.contacts[i],patch);this.saveLocal();return this.state.contacts[i];}
    return null;
  },
  async deleteContacts(ids){
    if(!ids.length)return;
    if(this.mode==='supabase'){
      const CH=60;
      for(let i=0;i<ids.length;i+=CH){
        const chunk=ids.slice(i,i+CH);
        await this.apiJSON('contacts?id=in.('+chunk.map(encodeURIComponent).join(',')+')',{method:'DELETE'});
      }
    }
    const s=new Set(ids);
    this.state.contacts=this.state.contacts.filter(x=>!s.has(x.id));
    if(this.mode!=='supabase')this.saveLocal();
  },

  /* -------- categories -------- */
  async upsertCategory(o){
    if(this.mode==='supabase'){
      const body={name:o.name,icon:o.icon||'📁',sort_order:o.sort_order||0};
      if(o.id){
        const res=await this.apiJSON('categories?id=eq.'+encodeURIComponent(o.id),
          {method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
        const row=Array.isArray(res)?res[0]:res;
        const i=this.state.categories.findIndex(x=>x.id===o.id);if(i>=0)this.state.categories[i]=row;return row;
      }
      const res=await this.apiJSON('categories',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
      const row=Array.isArray(res)?res[0]:res;this.state.categories.push(row);return row;
    }
    if(o.id){const i=this.state.categories.findIndex(x=>x.id===o.id);
      this.state.categories[i]=Object.assign(this.state.categories[i],o);this.saveLocal();return this.state.categories[i];}
    const row={id:uid(),name:o.name,icon:o.icon||'📁',sort_order:o.sort_order||0};
    this.state.categories.push(row);this.saveLocal();return row;
  },
  async deleteCategory(id){
    if(this.mode==='supabase')await this.apiJSON('categories?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
    this.state.categories=this.state.categories.filter(x=>x.id!==id);
    this.state.subcategories=this.state.subcategories.filter(x=>x.category_id!==id);
    this.state.contacts.forEach(c=>{if(c.category_id===id)c.category_id=null;
      if(c.subcategory_id&&!this.state.subcategories.some(s=>s.id===c.subcategory_id))c.subcategory_id=null;});
    if(this.mode!=='supabase')this.saveLocal();
  },
  async upsertSub(o){
    if(this.mode==='supabase'){
      const body={category_id:o.category_id,name:o.name,sort_order:o.sort_order||0};
      if(o.id){
        const res=await this.apiJSON('subcategories?id=eq.'+encodeURIComponent(o.id),
          {method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
        const row=Array.isArray(res)?res[0]:res;
        const i=this.state.subcategories.findIndex(x=>x.id===o.id);if(i>=0)this.state.subcategories[i]=row;return row;
      }
      const res=await this.apiJSON('subcategories',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
      const row=Array.isArray(res)?res[0]:res;this.state.subcategories.push(row);return row;
    }
    if(o.id){const i=this.state.subcategories.findIndex(x=>x.id===o.id);
      this.state.subcategories[i]=Object.assign(this.state.subcategories[i],o);this.saveLocal();return this.state.subcategories[i];}
    const row={id:uid(),category_id:o.category_id,name:o.name,sort_order:o.sort_order||0};
    this.state.subcategories.push(row);this.saveLocal();return row;
  },
  async deleteSub(id){
    if(this.mode==='supabase')await this.apiJSON('subcategories?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
    this.state.subcategories=this.state.subcategories.filter(x=>x.id!==id);
    this.state.contacts.forEach(c=>{if(c.subcategory_id===id)c.subcategory_id=null;});
    if(this.mode!=='supabase')this.saveLocal();
  },
  async upsertTag(o){
    if(this.mode==='supabase'){
      const body={name:o.name,color:o.color||'#6b7cff'};
      if(o.id){
        const res=await this.apiJSON('tags?id=eq.'+encodeURIComponent(o.id),
          {method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
        const row=Array.isArray(res)?res[0]:res;
        const i=this.state.tags.findIndex(x=>x.id===o.id);if(i>=0)this.state.tags[i]=row;return row;
      }
      const res=await this.apiJSON('tags',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify(body)});
      const row=Array.isArray(res)?res[0]:res;this.state.tags.push(row);return row;
    }
    if(o.id){const i=this.state.tags.findIndex(x=>x.id===o.id);
      this.state.tags[i]=Object.assign(this.state.tags[i],o);this.saveLocal();return this.state.tags[i];}
    const old=this.state.tags.find(t=>t.name===o.name);
    if(old){Object.assign(old,o);this.saveLocal();return old;}
    const row={id:uid(),name:o.name,color:o.color||'#6b7cff'};
    this.state.tags.push(row);this.saveLocal();return row;
  },
  async deleteTag(id){
    const tag=this.state.tags.find(x=>x.id===id);
    if(this.mode==='supabase')await this.apiJSON('tags?id=eq.'+encodeURIComponent(id),{method:'DELETE'});
    this.state.tags=this.state.tags.filter(x=>x.id!==id);
    if(tag)this.state.contacts.forEach(c=>{c.tag_names=(c.tag_names||[]).filter(t=>t!==tag.name);});
    if(this.mode!=='supabase')this.saveLocal();
  },

  /* -------- settings KV -------- */
  async getKeyValue(key){
    if(this.mode==='supabase'&&this.online){
      try{
        const r=await this.apiJSON('app_settings?select=value&key=eq.'+encodeURIComponent(key));
        if(Array.isArray(r)&&r[0])return r[0].value;
      }catch(e){}
    }
    return localStorage.getItem('contacts.kv.'+key);
  },
  async setKeyValue(key,value){
    localStorage.setItem('contacts.kv.'+key,value);
    if(this.mode==='supabase'&&this.online){
      try{
        await this.apiJSON('app_settings',{method:'POST',
          headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
          body:JSON.stringify({key,value})});
      }catch(e){}
    }
  },
  async getAdminHash(){
    const dbh=await this.getKeyValue('admin_password_hash');
    if(dbh)return dbh;
    return localStorage.getItem(HASH_KEY)||null;
  },
  async setAdminHash(h){
    localStorage.setItem(HASH_KEY,h);
    await this.setKeyValue('admin_password_hash',h);
  }
};

/* ============================================================================
   视图状态与筛选
   ========================================================================== */
const View={kind:'all',categoryId:null,subcategoryId:null,tagName:null,q:'',
  mode:localStorage.getItem('contacts.viewmode')||'grid',selMode:false,selected:new Set()};

const catName=id=>(Store.state.categories.find(c=>c.id===id)||{}).name||'';
const subName=id=>(Store.state.subcategories.find(c=>c.id===id)||{}).name||'';
const tagObj=name=>Store.state.tags.find(t=>t.name===name)||null;
const tagColor=name=>{const t=tagObj(name);return t?t.color:'#8892ab';};

function currentList(){
  let list=Store.state.contacts.slice();
  const q=View.q.trim().toLowerCase();
  if(View.kind==='starred')list=list.filter(c=>c.starred);
  else if(View.kind==='untagged')list=list.filter(c=>!c.category_id&&!(c.tag_names||[]).length);
  else if(View.kind==='category')list=list.filter(c=>c.category_id===View.categoryId);
  else if(View.kind==='subcategory')list=list.filter(c=>c.subcategory_id===View.subcategoryId);
  else if(View.kind==='tag')list=list.filter(c=>(c.tag_names||[]).includes(View.tagName)||catName(c.category_id)===View.tagName);

  if(q){
    const qd=phoneDigits(q);
    list=list.filter(c=>{
      const hay=[c.formatted_name,c.last_name,c.first_name,c.middle_name,c.nickname,c.prefix,c.suffix,
        c.org,c.department,c.job_title,c.email,c.email_work,c.website,c.note,c.birthday,
        [c.address_country,c.address_region,c.address_city,c.address_street,c.address_zip].join(' '),
        (c.tag_names||[]).join(' '),catName(c.category_id),subName(c.subcategory_id)
      ].join(' ').toLowerCase();
      if(hay.includes(q))return true;
      if(qd.length>=2&&allPhones(c).some(p=>phoneDigits(p).includes(qd)))return true;
      return false;
    });
  }
  list.sort((a,b)=>{
    if(!!a.starred!==!!b.starred)return a.starred?-1:1;
    const ka=sortKey(a),kb=sortKey(b);
    if(ka!==kb)return ka<kb?-1:1;
    return displayName(a).localeCompare(displayName(b),'zh-Hans-CN');
  });
  return list;
}
const selectedContacts=()=>Store.state.contacts.filter(c=>View.selected.has(c.id));
